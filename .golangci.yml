version: "2"
linters:
  enable:
    - errcheck        # unchecked errors
    - govet           # suspicious constructs (shadow, printf misuse)
    - staticcheck     # comprehensive static analysis (SA*, S*, QF*)
    - gosec           # security anti-patterns (hardcoded creds, weak crypto)
    - revive          # idiomatic style (golint successor)
    - gocritic        # opinionated checks (incl. ruleguard if rules/ exists)
    - ineffassign     # assignments whose value is never used
    - unused          # unexported identifiers never referenced
    - noctx           # http requests without context.Context
    - funlen          # function length limit
    - gocyclo         # cyclomatic complexity
    - goconst         # repeated strings that should be constants
    - lll             # long line detection
    - dupl            # duplicated code blocks
    - mnd             # magic numbers (allow basic tolerances)
    - tagliatelle     # struct tag conventions (json/yaml/etc.)
    - modernize       # modern Go idioms (slices.Contains, min/max, etc.)
    - nolintlint      # ill-formed / insufficient //nolint directives
    - thelper         # test helpers must call t.Helper()
    - errorlint       # error wrapping must use %w, errors.Is/As
    - nilerr          # returning nil error when function signals an error
    - sloglint        # structured logging key-value pairs must be constant
    - contextcheck    # context must propagate through call chains
    - containedctx    # structs must not embed context.Context
    - bodyclose       # HTTP response body must be closed
    - testifylint     # testify assert vs require checks
    - gocognit        # cognitive complexity (readability, not paths)
    - perfsprint      # fmt.Sprintf -> faster strconv/string concat (hot paths)
    - prealloc        # slice declarations that could be pre-allocated
    - fatcontext      # nested context.With* inside loops/function literals
    - usestdlibvars   # use stdlib constants (http.MethodGet, time.RFC3339, ...)
    - forbidigo       # no bare time.Sleep in production code (see settings below)
    # Note: stylecheck's ST* analyzers are bundled into `staticcheck` in
    # golangci-lint v2, so enabling staticcheck (above) already covers
    # them. `gofumpt` is a formatter, configured under `formatters:` below.
  settings:
    forbidigo:
      # A bare time.Sleep in production is uncancellable: it holds its goroutine
      # (and any wg.Wait draining it at shutdown) for its full duration. Three
      # real sites shipped this way — the queue worker's receive-error backoff
      # (1s, on every failing worker, delaying Stop()), the onboarding-greet
      # demo pause, and that pause's own retry loop. All three became
      # `select { ctx.Done(); timer.C }` waits. The rule now keeps a fourth from
      # being written: needing an uninterruptible pause in production is itself
      # the smell this catches.
      #
      # Tests are exempt (see exclusions): asserting on a fixed window is
      # sometimes the only way to express "this must NOT happen".
      forbid:
        - pattern: 'time\.Sleep'
          msg: "time.Sleep is uncancellable — it holds its goroutine through shutdown. Wait on a context instead: select { case <-ctx.Done(): ; case <-timer.C: }. See internal/queue/workers.go waitOrStop."
      analyze-types: true
      exclude-godoc-examples: true
    errcheck:
      check-type-assertions: true
      check-blank: false    # blank identifier (_ = expr()) is idiomatic Go for intentional error discard
    gosec:
      severity: medium
    gocritic:
      enabled-checks:
        - ruleguard
      settings:
        ruleguard:
          # rules/rules.go holds project-specific concurrency rules. It needs
          # the `//go:build ruleguard` tag and is loaded ONLY by gocritic; the
          # `dsl` import is a build-time dependency (go.mod `tool`).
          rules: "rules/rules.go"
    govet:
      enable-all: true
      disable:
        - fieldalignment  # too noisy for template-heavy projects
    revive:
      rules:
        - name: exported
        - name: var-naming
        - name: error-return
        - name: error-strings
        - name: error-naming
        - name: context-as-argument
        - name: context-keys-type
        - name: dot-imports
        - name: empty-block
        - name: superfluous-else
        - name: unused-parameter
        - name: var-declaration
        - name: package-comments
    funlen:
      lines: 100
      statements: 60
    gocyclo:
      min-complexity: 15
    gocognit:
      min-complexity: 60
    testifylint:
      enable-all: false
      disable:
        - float-compare
        - go-require
        - compares
      disable-all: false
    sloglint:
      no-mixed-args: true
    goconst:
      min-len: 4
      min-occurrences: 3
    lll:
      line-length: 120
      tab-width: 1
    mnd:
      checks:
        - argument
        - case
        - condition
        - return
      ignored-numbers:
        - "0"
        - "1"
        - "2"
        - "3"
        - "10"
        - "100"
        - "1000"
        - "200"
        - "500"
        - "10000"
        - "150405"  # time.Now format HHMMSS
  exclusions:
    generated: lax
    presets:
      - comments
      - common-false-positives
      - legacy
      - std-error-handling
    rules:
      # Credits wiring is inherently branchy (BYOK+payments+stripe) — readability secondary
      - path: features/credits/credits\.go
        linters:
          - gocyclo
          - gocognit
      - path: features/credits/gateway.go
        linters:
          - govet
          - gocyclo
      - path: features/credits/gateway_test.go
        linters:
          - unused
          - lll
      - path: features/credits/stripe_test\.go
        linters:
          - lll
          - goconst
          - noctx
      - path: features/credits/gateway\.go
        linters:
          - govet
          - gocyclo
      - path: features/credits/gateway_test\.go
        linters:
          - unused
          - lll
      # Ignore length checks in templ-generated files
      - path: (.+)_templ\.go
        linters:
          - funlen
          - gocyclo
          - dupl
          - lll
      # pb_data is a test artifact directory
      - path: internal/workflow/pb_data/
        linters:
          - all
      # db/idempotency_seed.go keeps enableTodosIdempotency as intentional
      # reference code (db/seed.go wires RegisterIdempotencyHook instead);
      # the helper is referenced only in comments, so don't fail on unused.
      - path: db/idempotency_seed\.go
        linters:
          - unused
      # internal/nats/presence.go uses revive's unused-parameter check but
      # revive has a known false positive with string concatenation — roomID
      # IS used in "room."+roomID+".user."+info.ID but revive doesn't track
      # usage through string concatenation. See the UserJoin function body.
      - path: internal/nats/presence\.go
        linters:
          - revive
      # Test files repeat short literals (field names like "email",
      # presence type tags) below the signal threshold; don't fail CI on
      # goconst/mnd noise there.
      - path: _test\.go
        linters:
          - goconst
          - mnd
          - funlen
      # E2E and integration tests are inherently complex; cyclomatic
      # complexity is a design concern, not a correctness risk.
      - path: _test\.go
        linters:
          - gocyclo
      # bodyclose is for production HTTP callers, not test response readers
      # (tests should NOT close the response body of an httptest server).
      - path: _test\.go
        linters:
          - bodyclose
      # forbidigo is a PRODUCTION rule (uncancellable sleeps). Tests legitimately
      # sleep to assert absence, to pace a fixture, or to let a watcher catch up.
      - path: _test\.go
        linters:
          - forbidigo
formatters:
  enable:
    - gofumpt
    - goimports
  settings:
    goimports:
      local-prefixes:
        - github.com/calionauta/gogogo
        - github.com/calionauta/ai-credits