version: "2"
linters:
  enable:
    - errcheck        # unchecked errors
    - govet           # suspicious constructs (shadow, printf misuse)
    - staticcheck     # comprehensive static analysis (SA*, S*, QF*)
    - gosec           # security anti-patterns (hardcoded creds, weak crypto)
    - revive          # idiomatic style (golint successor)
    - gocritic        # opinionated checks (incl. ruleguard if rules/ exists)
    - ineffassign     # assignments whose value is never used
    - unused          # unexported identifiers never referenced
    - noctx           # http requests without context.Context
    - funlen          # function length limit
    - gocyclo         # cyclomatic complexity
    - goconst         # repeated strings that should be constants
    - lll             # long line detection
    - dupl            # duplicated code blocks
    - mnd             # magic numbers (allow basic tolerances)
    - tagliatelle     # struct tag conventions (json/yaml/etc.)
    - modernize       # modern Go idioms (slices.Contains, min/max, etc.)
    - nolintlint      # ill-formed / insufficient //nolint directives
    - thelper         # test helpers must call t.Helper()
    - errorlint       # error wrapping must use %w, errors.Is/As
    - nilerr          # returning nil error when function signals an error
    - sloglint        # structured logging key-value pairs must be constant
    - contextcheck    # context must propagate through call chains
    - containedctx    # structs must not embed context.Context
    - bodyclose       # HTTP response body must be closed
    - testifylint     # testify assert vs require checks
    - gocognit        # cognitive complexity (readability, not paths)
    - perfsprint      # fmt.Sprintf -> faster strconv/string concat (hot paths)
    - prealloc        # slice declarations that could be pre-allocated
    - fatcontext      # nested context.With* inside loops/function literals
    - usestdlibvars   # use stdlib constants (http.MethodGet, time.RFC3339, ...)
    - forbidigo       # no bare time.Sleep in production code (see settings below)
    - unparam         # a parameter constant at every call site is a constant in disguise
    - nestif          # deeply nested ifs (readability; settings below pin the skill's depth)
    - iface           # interface pollution: unused methods, single-implementation shapes
    - interfacebloat  # interfaces that have grown past a usable contract
    # NOT enabled: ireturn. It is a real SOLID/ISP signal, but here it fires on
    # ~11 idiomatic factories that MUST return an interface
    # (Routes) chi.Router, Render) templ.Component, SnapshotStore) — the
    # seam IS the design, and an allow-list long enough to silence them would
    # silence the rule. Measured before deciding; see the ISP note in
    # skills/gogogo-coding-standards.
    - recvcheck       # one receiver name/type per method set (gofmt cannot see this)
    # NOT enabled: paralleltest. Measured at 50 findings, and most are correct as
    # written — synctest tests virtualize time, fixed-port/global-fixture tests
    # and goleak checks must serialize. Enabling it would buy 50 annotations
    # whose reasons are all "this test genuinely cannot run in parallel", plus a
    # standing invitation to bathe real leaks in t.Parallel() to silence it.
    # NOT enabled: gochecknoglobals/varnamelen — both fire on this repo's
    # deliberate registries (renderers, panels, capabilities.All) and on short
    # receivers; the noise outweighs the signal. Measured, not assumed.
    # Note: stylecheck's ST* analyzers are bundled into `staticcheck` in
    # golangci-lint v2, so enabling staticcheck (above) already covers
    # them. `gofumpt` is a formatter, configured under `formatters:` below.
  settings:
    forbidigo:
      # A bare time.Sleep in production is uncancellable: it holds its goroutine
      # (and any wg.Wait draining it at shutdown) for its full duration. Three
      # real sites shipped this way — the queue worker's receive-error backoff
      # (1s, on every failing worker, delaying Stop()), the onboarding-greet
      # demo pause, and that pause's own retry loop. All three became
      # `select { ctx.Done(); timer.C }` waits. The rule now keeps a fourth from
      # being written: needing an uninterruptible pause in production is itself
      # the smell this catches.
      #
      # Tests are exempt (see exclusions): asserting on a fixed window is
      # sometimes the only way to express "this must NOT happen".
      forbid:
        - pattern: 'time\.Sleep'
          msg: "time.Sleep is uncancellable — it holds its goroutine through shutdown. Wait on a context instead: select { case <-ctx.Done(): ; case <-timer.C: }. See internal/queue/workers.go waitOrStop."
      analyze-types: true
      exclude-godoc-examples: true
    errcheck:
      check-type-assertions: true
      check-blank: false    # blank identifier (_ = expr()) is idiomatic Go for intentional error discard
    gosec:
      severity: medium
    gocritic:
      enabled-checks:
        - ruleguard
      settings:
        ruleguard:
          # rules/rules.go holds project-specific concurrency rules. It needs
          # the `//go:build ruleguard` tag and is loaded ONLY by gocritic; the
          # `dsl` import is a build-time dependency (go.mod `tool`).
          rules: "rules/rules.go"
    govet:
      enable-all: true
      disable:
        - fieldalignment  # too noisy for template-heavy projects
    revive:
      rules:
        - name: exported
        - name: var-naming
        - name: error-return
        - name: error-strings
        - name: error-naming
        - name: context-as-argument
        - name: context-keys-type
        - name: dot-imports
        - name: empty-block
        - name: superfluous-else
        - name: unused-parameter
        - name: var-declaration
        - name: package-comments
    funlen:
      lines: 100
      statements: 60
    gocyclo:
      min-complexity: 15
    nestif:
      # The skill says "indentation depth <= 3"; nestif counts complexity, not
      # depth, and 4 is what that maps to here. Measured at 4: exactly three
      # findings repo-wide, all real and all fixed rather than excused. At the
      # default (5) the three deepened without complaint.
      min-complexity: 4
    gocognit:
      min-complexity: 60
    testifylint:
      enable-all: false
      disable:
        - float-compare
        - go-require
        - compares
      disable-all: false
    sloglint:
      no-mixed-args: true
    goconst:
      min-len: 4
      min-occurrences: 3
    lll:
      line-length: 120
      tab-width: 1
    mnd:
      checks:
        - argument
        - case
        - condition
        - return
      ignored-numbers:
        - "0"
        - "1"
        - "2"
        - "3"
        - "10"
        - "100"
        - "1000"
        - "200"
        - "500"
        - "10000"
        - "150405"  # time.Now format HHMMSS
    nolintlint:
      # A suppression without a named linter or a reason is a bypass, not a
      # decision — CI rejects it so the reasoning stays next to the code.
      allow-unused: false
      require-explanation: true
      require-specific: true
  exclusions:
    generated: lax
    presets:
      - comments
      - common-false-positives
      - legacy
      - std-error-handling
    rules:
      # Credits wiring is inherently branchy (BYOK+payments+stripe) — readability secondary
      - path: features/credits/credits\.go
        linters:
          - gocyclo
          - gocognit
      - path: features/credits/gateway.go
        linters:
          - govet
          - gocyclo
      - path: features/credits/gateway_test.go
        linters:
          - unused
          - lll
      - path: features/credits/stripe_test\.go
        linters:
          - lll
          - goconst
          - noctx
      - path: features/credits/gateway\.go
        linters:
          - govet
          - gocyclo
      - path: features/credits/gateway_test\.go
        linters:
          - unused
          - lll
      # Standalone CLIs and gate binaries print to stdout BY DESIGN: the output
      # is the product (a shell script or a human reads it) and several run
      # before the app logger could exist. StdoutBypassesSlog targets the HTTP
      # slices and internal packages, not these, so the rule is scoped here
      # rather than in Go (ruleguard's PkgPath shape differs between the real
      # module and the fixture harness, which made an in-rule exemption lie).
      - path: ^(cmd|scripts)/
        linters:
          - gocritic
      # Ignore length checks in templ-generated files
      - path: (.+)_templ\.go
        linters:
          - funlen
          - gocyclo
          - dupl
          - lll
      # internal/nats/presence.go uses revive's unused-parameter check but
      # revive has a known false positive with string concatenation — roomID
      # IS used in "room."+roomID+".user."+info.ID but revive doesn't track
      # usage through string concatenation. See the UserJoin function body.
      - path: internal/nats/presence\.go
        linters:
          - revive
      # Test files repeat short literals (field names like "email",
      # presence type tags) below the signal threshold; don't fail CI on
      # goconst/mnd noise there.
      - path: _test\.go
        linters:
          - goconst
          - mnd
      # NOT a blanket `funlen` exemption for tests: function length stays a real
      # signal there too, and no test currently needs one. Existing long tests
      # are LINEAR setup (tempdir, config, app, transport: no branching), where
      # splitting would only move lines into helpers for no reader benefit —
      # exempt such a test individually and WITH its reason, so a NEW long test
      # fails CI instead of joining a silent blanket exemption.
      # E2E and integration tests are inherently complex; cyclomatic
      # complexity is a design concern, not a correctness risk.
      - path: _test\.go
        linters:
          - gocyclo
      # bodyclose is for production HTTP callers, not test response readers
      # (tests should NOT close the response body of an httptest server).
      - path: _test\.go
        linters:
          - bodyclose
      # forbidigo is a PRODUCTION rule (uncancellable sleeps). Tests legitimately
      # sleep to assert absence, to pace a fixture, or to let a watcher catch up.
      - path: _test\.go
        linters:
          - forbidigo
      # Generated templ files are machine output; the nesting and interface
      # rules describe code a human should restructure, which cannot apply.
      - path: (.+)_templ\.go
        linters:
          - nestif
formatters:
  enable:
    - gofumpt
    - goimports
  settings:
    goimports:
      local-prefixes:
        - github.com/calionauta/gogogo
        - github.com/calionauta/ai-credits