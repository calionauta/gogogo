# GoReleaser v2 — prebuilt installer binaries (gogogo CLI + gogogo-mcp + gogogo-gui).
#
# Trigger: push a v* tag (see .github/workflows/release.yml). Nothing runs
# on normal pushes. Both binaries are pure Go (CGO_ENABLED=0), so the full
# OS × arch matrix cross-compiles from one Linux runner.
#
# Deliberately v1-minimal: release archives + SHA256SUMS. No Homebrew
# (needs a tap repo), no cosign (keyless adds a sigstore dependency) —
# revisit when installs justify it.
version: 2

project_name: gogogo

builds:
  - id: gogogo
    main: ./cmd/gogogo
    binary: gogogo
    env:
      - CGO_ENABLED=0
    goos: [linux, darwin, windows]
    goarch: [amd64, arm64]
    flags: [-trimpath]
    ldflags:
      - -s -w
      - -X github.com/calionauta/gogogo/internal/installer.Version={{.Version}}

  - id: gogogo-mcp
    dir: cmd/gogogo-mcp
    main: .
    binary: gogogo-mcp
    env:
      - CGO_ENABLED=0
    goos: [linux, darwin, windows]
    goarch: [amd64, arm64]
    flags: [-trimpath]
    ldflags:
      - -s -w
      - -X main.version={{.Version}}

  - id: gui
    # Native window (gogpu, pure Go, CGO_ENABLED=0): cross-compiles from one
    # Linux runner like the CLIs above. Verified locally for the full matrix
    # before wiring (GOOS × GOARCH builds, no version var to stamp in main).
    main: ./cmd/gui
    binary: gogogo-gui
    env:
      - CGO_ENABLED=0
    goos: [linux, darwin, windows]
    goarch: [amd64, arm64]
    flags: [-trimpath]
    ldflags:
      - -s -w

# One archive per platform carrying all three binaries: a single download for
# install.sh (no per-tool asset hunting).
archives:
  - id: bundle
    ids: [gogogo, gogogo-mcp, gui]
    name_template: "{{ .ProjectName }}-{{ .Version }}-{{ .Os }}-{{ .Arch }}"

checksum:
  name_template: "SHA256SUMS.txt"
  algorithm: sha256

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^site:"
