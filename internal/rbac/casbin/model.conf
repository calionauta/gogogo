[request_definition]
r = sub, obj, act

[policy_definition]
p = sub, obj, act

[role_definition]
g = _, _

[policy_effect]
e = some(where (p.eft == allow))

[matchers]
# pathMatch and attrOK are Go functions registered in internal/rbac/dynamic.go.
# pathMatch accepts a bare path string OR an ABAC Object (obj.Path); keyMatch2
# semantics are unchanged (`*` crosses `/`). attrOK is the ownership clause:
# it passes for a string and for an Object with no owner, and otherwise
# requires admin or subject==owner. This keeps the string callers (tests, the
# middleware) identical while enabling per-record decisions.
m = g(r.sub, p.sub) && pathMatch(r.obj, p.obj) && regexMatch(r.act, p.act) && attrOK(r.sub, r.obj)
