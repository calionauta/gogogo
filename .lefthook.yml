# Lefthook config — gogogo
# Run `make setup` to activate hooks (installs wrappers into .githooks/).
# Install lefthook: go install github.com/evilmartians/lefthook@latest
#
# Jobs with `glob:` only run when matching files are staged.
# Scripts live in bin/check-*.sh so YAML stays free of escaping traps.

pre-commit:
  parallel: true
  jobs:
    # A file can only be too big if a .go file changed. Without this glob the
    # job ran on every commit — a docs-only or CSS-only commit was blocked by a
    # size violation in a file it did not touch, which trains people to bypass
    # the hook with LEFTHOOK_EXCLUDE=.
    - name: file-sizes
      run: .githooks/check-sizes.sh
      glob: "*.go"

    - name: fmt-gofumpt
      run: bin/check-fmt.sh
      glob: "*.go"

    - name: mod-tidy
      run: bin/check-mod-tidy.sh

    - name: scope-lint
      run: go run ./cmd/check-scope
      glob: "{internal,features}/**/*.go"

    # A SKILL.md's frontmatter is parsed by the skill HOST (Claude Code, pi),
    # never by this repo's build — so an unquoted ": " in the description
    # ships silently and surfaces as "Error in user YAML" in the host UI.
    # Validated with a real YAML parser, not a regex.
    - name: skill-frontmatter
      run: go run ./cmd/check-skill-frontmatter
      glob: "**/SKILL.md"

    - name: datastar-lint
      run: bin/check-datastar.sh
      glob: "*.{templ,go}"

    # src/css/input.css scans features/, web/ and internal/ only (source(none) +
    # explicit @source globs), so these are the only extensions that can change
    # the bundle. site/ is deliberately absent: the landing page has its own
    # stylesheet and does not use the Tailwind bundle.
    - name: css-check
      run: bin/check-css.sh
      glob: "*.{templ,go,css}"

    # scripts/lint-safe.sh sizes the run to the host's free RAM + cores: full
    # repo only when there is headroom, otherwise changed packages, always
    # memory-capped in a cgroup. Never `cache clean` (that re-type-checks the
    # whole module cold and is what tips a shared host into swap).
    - name: golangci-lint
      run: bash scripts/lint-safe.sh
      glob: "*.go"

    - name: agents-md-staleness
      run: bin/check-agents-md.sh
      glob: "{AGENTS.md,go.mod,**/*.go,**/*.templ}"

    # Non-blocking by design (always exits 0): warns when a behaviour-carrying
    # file changes without a docs/ update. See the script header for why it
    # does not block.
    - name: docs-staleness
      run: bin/check-docs-staleness.sh
      glob: "{config/**,router/**,db/**,Makefile,.github/workflows/**,scripts/**,features/**,internal/**,docs/**,README.md}"

# pre-push stays LIGHT. The heavy gate (lint + race tests + build + smoke)
# runs in GitHub Actions CI (`make ci-local` equivalent) on the runner after
# push, in parallel with your continued work, and blocks the auto-deploy if it
# fails — so a broken commit never ships. Blocking the local push on the full
# race suite (~5min) for every .go change would stall the coding agent for
# nothing, since CI runs the exact same gate.
#
# Local pre-push keeps only what gives instant, local feedback: vuln scan +
# deadcode. Everything faster lives in pre-commit (already parallel, glob-
# filtered). Run the whole gate on demand with `make ci-local`.
pre-push:
  jobs:
    - name: govulncheck
      run: bin/check-govulncheck.sh
    - name: deadcode
      run: bin/check-deadcode.sh

post-merge:
  jobs:
    - name: regen-assets
      run: bash -c 'if git diff HEAD@{1} HEAD --name-only | grep -qE "\.(templ|css|go)$"; then echo "→ regenerating assets..."; make templ css-all; fi'
