declaration:
    tables:
        - ext_kiosk_orders
    routes:
        - method: GET
          pattern: /kiosk
        - method: POST
          pattern: /api/kiosk/preview
        - method: POST
          pattern: /api/kiosk/confirm
    slots:
        - nav.sidebar
    actions:
        - verb: confirm
          description: Confirm one order for the calling owner, parsed from the posted text.
          route:
            method: POST
            pattern: /api/kiosk/confirm
          params:
            - text
            - previewed
          paramHelp:
            previewed: The preview serialization the caller was shown; empty when nothing was previewed.
            text: The spoken or typed order, in the recipe's own menu vocabulary.
    omitted:
        - route:
            method: POST
            pattern: /api/kiosk/preview
          reason: Demo-only parse that writes nothing and answers with a UI patch; it never completes headless.
    metrics:
        - label: Orders confirmed
          query: SELECT COUNT(*) FROM ext_kiosk_orders WHERE owner = ?
        - kind: outcome
          id: order_without_repair
          job: Receive the order you asked for without fixing a misread order
          beneficiary: user
          success:
            label: Orders without repair
            query: SELECT COUNT(*) FROM ext_kiosk_orders WHERE owner = ? AND corrected = 0
          total:
            label: Orders confirmed
            query: SELECT COUNT(*) FROM ext_kiosk_orders WHERE owner = ?
          counterMetrics:
            - label: Orders corrected
              query: SELECT COUNT(*) FROM ext_kiosk_orders WHERE owner = ? AND corrected = 1
          window: session
    translations:
        - locale: pt-BR
          metrics:
            Orders confirmed: Pedidos confirmados
            Orders without repair: Pedidos sem reparo
            Orders corrected: Pedidos corrigidos
    panel:
        component: kiosk_orders
        prompt: 'kiosk_orders {scope: recent|all} whenever the user asks about their orders'
        writable:
            - scope
        values:
            - recent
            - all
register: features/kiosk/handlers
