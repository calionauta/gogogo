declaration:
  metrics:
  - {label: Total, query: "SELECT COUNT(*) FROM boards", signal: boardsTotal, ownerBinds: false}
  - {label: Mine, query: "SELECT COUNT(*) FROM boards WHERE owner = ?", signal: boardsMine}
  panel:
    component: "boards_list"
    prompt: "boards_list {scope: all|mine} whenever the request involves the shared whiteboards (list them, find a board, plan around them). Renders their REAL rows, so it is the only component allowed to answer with board content. scope: mine ONLY when the user asks for their own boards; all otherwise. Always send scope inside props."
    writable: [scope]
  routes:
  - method: GET
    pattern: /whiteboard
  - method: GET
    pattern: /whiteboard/new
  - method: GET
    pattern: /whiteboard/{docID}
  - method: GET
    pattern: /api/whiteboards/fragment
  - method: POST
    pattern: /api/whiteboards
  - method: GET
    pattern: /api/whiteboard/{docID}/stream
  - method: GET
    pattern: /api/whiteboard/{docID}/snapshot
  - method: POST
    pattern: /api/whiteboard/{docID}/update
  - method: POST
    pattern: /api/whiteboard/{docID}/presence
  - method: POST
    pattern: /api/whiteboard/{docID}/delete
  actions:
  - verb: snapshot
    description: Read the board's current shape list as JSON.
    route:
      method: GET
      pattern: /api/whiteboard/{docID}/snapshot
    pathParams:
    - docID
    paramHelp:
      docID: The board's UUID.
  - verb: create
    description: Create an empty board owned by the caller and return its id and page path.
    route:
      method: POST
      pattern: /api/whiteboards
    browserPath: /whiteboard/new
  - verb: update
    description: Apply one canvas op (add, move, clear, …) to a board the caller may edit; the reply is
      the new shape list or a 409 with the current one.
    route:
      method: POST
      pattern: /api/whiteboard/{docID}/update
    params:
    - body
    pathParams:
    - docID
    query:
    - clientID
    rawBody: body
    paramHelp:
      docID: The board's UUID.
      clientID: The acting tab id, so the op is attributed and other tabs see who drew.
      body: 'The ShapeOp JSON document: op, baseVersion and shape, exactly as the browser sends it.'
  - verb: delete
    description: Delete a board; the caller must own it or be an admin. Irreversible.
    route:
      method: POST
      pattern: /api/whiteboard/{docID}/delete
    pathParams:
    - docID
    paramHelp:
      docID: The board's UUID.
  omitted:
  - route:
      method: POST
      pattern: /api/whiteboard/{docID}/presence
    reason: ephemeral cursor/peer broadcast; it persists nothing and answers a UI patch
register: features/whiteboard/handlers
