declaration:
  routes:
  - method: GET
    pattern: /room
  - method: GET
    pattern: /room/roster
  - method: GET
    pattern: /room/stream
  - method: POST
    pattern: /room/heartbeat
  - method: POST
    pattern: /room/join
  - method: POST
    pattern: /room/acquire
  - method: POST
    pattern: /room/release
  - method: POST
    pattern: /room/leave
  - method: POST
    pattern: /room/crash
  actions:
  - verb: join
    description: Put this client back in the room roster after a leave.
    route:
      method: POST
      pattern: /room/join
    query:
    - clientID
    paramHelp:
      clientID: The tab id whose roster entry to move.
  - verb: leave
    description: Take this client out of the room roster.
    route:
      method: POST
      pattern: /room/leave
    query:
    - clientID
    paramHelp:
      clientID: The tab id whose roster entry to move.
  - verb: acquire
    description: Take the pen for this client.
    route:
      method: POST
      pattern: /room/acquire
    query:
    - clientID
    paramHelp:
      clientID: The tab id whose roster entry to move.
  - verb: release
    description: Give the pen back for this client.
    route:
      method: POST
      pattern: /room/release
    query:
    - clientID
    paramHelp:
      clientID: The tab id whose roster entry to move.
  omitted:
  - route:
      method: POST
      pattern: /room/heartbeat
    reason: ambient liveness ping the live stream already replaces; it changes no product state
  - route:
      method: POST
      pattern: /room/crash
    reason: 'demo failure injection: it restarts the room actor to watch recovery, not a task a caller performs'
register: features/room/handlers
