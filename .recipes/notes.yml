declaration:
  metrics:
  - {label: Notes, query: "SELECT COUNT(*) FROM notes WHERE owner = ?", signal: notesCount}
  panel:
    component: "notes_list"
    prompt: "notes_list {scope: all|mine} whenever the request involves the user's shared notes"
    writable: [scope]
  routes:
  - method: GET
    pattern: /notes
  - method: GET
    pattern: /notes/new
  - method: GET
    pattern: /notes/{docID}
  - method: GET
    pattern: /api/notes/fragment
  - method: POST
    pattern: /api/notes/{docID}/delete
  - method: GET
    pattern: /api/notes/{docID}/stream
  - method: POST
    pattern: /api/notes/{docID}/op
  - method: POST
    pattern: /api/notes/{docID}/typing
  - method: POST
    pattern: /api/notes/{docID}/caret
  - method: POST
    pattern: /api/notes/{docID}/leave
