declaration:
  metrics:
  - {label: Total, query: "SELECT COUNT(*) FROM notes", signal: notesTotal, ownerBinds: false}
  - {label: Mine, query: "SELECT COUNT(*) FROM notes WHERE owner = ?", signal: notesMine}
  panel:
    component: "notes_list"
    prompt: "notes_list {scope: all|mine} whenever the request involves the user's shared notes (list them, find a note's title, plan around them, summarize). Renders their REAL rows, so it is the only component allowed to answer with note content. scope: mine ONLY when the user asks for their own notes; all otherwise. Always send scope inside props."
    writable: [scope]
  routes:
  - method: GET
    pattern: /notes
  - method: GET
    pattern: /notes/new
  - method: GET
    pattern: /notes/{docID}
  - method: GET
    pattern: /api/notes/fragment
  - method: GET
    pattern: /api/notes/{docID}
  - method: POST
    pattern: /api/notes
  - method: POST
    pattern: /api/notes/{docID}/delete
  - method: GET
    pattern: /api/notes/{docID}/stream
  - method: POST
    pattern: /api/notes/{docID}/op
  - method: POST
    pattern: /api/notes/{docID}/typing
  - method: POST
    pattern: /api/notes/{docID}/caret
  - method: POST
    pattern: /api/notes/{docID}/leave
  actions:
  - verb: create
    description: Create an empty note owned by the caller and return its id and page path.
    route:
      method: POST
      pattern: /api/notes
    browserPath: /notes/new
  - verb: read
    description: Read one note's merged text and current revision as JSON.
    route:
      method: GET
      pattern: /api/notes/{docID}
    pathParams:
    - docID
    paramHelp:
      docID: The note's UUID.
  - verb: edit
    description: Apply one batch of text ops to a note the caller may edit; a stale base returns 409 with
      the authoritative revision.
    route:
      method: POST
      pattern: /api/notes/{docID}/op
    params:
    - body
    pathParams:
    - docID
    query:
    - clientID
    rawBody: body
    paramHelp:
      docID: The note's UUID.
      clientID: The acting tab id, so peers see who is editing and the caret is attributed.
      body: 'The op batch JSON: base (server revision), ops (ordered TextOp list) and an optional caret.'
  - verb: delete
    description: Delete a note; the caller must own it or be an admin. Irreversible.
    route:
      method: POST
      pattern: /api/notes/{docID}/delete
    pathParams:
    - docID
    paramHelp:
      docID: The note's UUID.
  omitted:
  - route:
      method: POST
      pattern: /api/notes/{docID}/typing
    reason: ephemeral typing indicator; it persists nothing and only peers see it
  - route:
      method: POST
      pattern: /api/notes/{docID}/caret
    reason: ephemeral caret position; a later reader cannot observe it
  - route:
      method: POST
      pattern: /api/notes/{docID}/leave
    reason: presence teardown for a tab that is going away; there is no product outcome to invoke
register: features/notes/handlers
