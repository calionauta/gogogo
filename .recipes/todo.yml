declaration:
  metrics:
  - {label: Open, query: "SELECT COUNT(*) FROM ext_todo_todos WHERE (owner = ? OR visibility = 'public') AND completed = 0", signal: openTodos}
  - {label: Done, query: "SELECT COUNT(*) FROM ext_todo_todos WHERE (owner = ? OR visibility = 'public') AND completed = 1", signal: doneTodos}
  - {label: Total, query: "SELECT COUNT(*) FROM ext_todo_todos WHERE owner = ? OR visibility = 'public'", signal: totalTodos}
  - {label: Shared, query: "SELECT COUNT(*) FROM ext_todo_todos WHERE visibility = 'public'", signal: sharedTodos, ownerBinds: false}
  panel:
    component: "todo_list"
    prompt: "todo_list {filter: open|done|all} whenever the request involves the user's OWN todos or tasks"
    writable: [filter]
  tables:
  - ext_todo_todos
  routes:
  - method: GET
    pattern: /api/todos
  - method: GET
    pattern: /api/todos/search
  - method: GET
    pattern: /api/todos/fragment
  - method: POST
    pattern: /api/todos
  - method: POST
    pattern: /api/todos/{id}/toggle
  - method: POST
    pattern: /api/todos/completed/delete
  - method: POST
    pattern: /api/todos/{id}/delete
  - method: GET
    pattern: /api/todos/{id}/confirm-delete
  - method: GET
    pattern: /api/todos/stream
  - method: GET
    pattern: /api/todos/events
  - method: POST
    pattern: /api/todos/suggest
  - method: POST
    pattern: /api/todos/suggest-simulated
  - method: POST
    pattern: /api/todos/retry-demo
  - method: GET
    pattern: /login
  - method: POST
    pattern: /login
  - method: GET
    pattern: /signup
  - method: POST
    pattern: /signup
  - method: POST
    pattern: /logout
  - method: GET
    pattern: /todo
  actions:
  - verb: create
    description: Create a todo owned by the calling session.
    route:
      method: POST
      pattern: /api/todos
    params:
    - title
    - idem_key
    - visibility
    paramHelp:
      title: The todo text.
      idem_key: Client-generated key that makes a retry idempotent.
      visibility: private or public.
  - verb: toggle
    description: Toggle a todo's completed state; the caller must own it.
    route:
      method: POST
      pattern: /api/todos/{id}/toggle
    pathParams:
    - id
    paramHelp:
      id: The todo's UUID.
  - verb: delete
    description: Delete one of the caller's own todos; irreversible.
    route:
      method: POST
      pattern: /api/todos/{id}/delete
    pathParams:
    - id
    paramHelp:
      id: The todo's UUID.
  - verb: clear_completed
    description: Delete every completed todo owned by the calling session.
    route:
      method: POST
      pattern: /api/todos/completed/delete
  omitted:
  - route:
      method: POST
      pattern: /api/todos/suggest
    reason: asynchronous LLM job; the answer arrives through the todo stream, never synchronously
  - route:
      method: POST
      pattern: /api/todos/suggest-simulated
    reason: UI demo of the suggest stepper; the real LLM path is the suggest job
  - route:
      method: POST
      pattern: /api/todos/retry-demo
    reason: UI demo of the queue/retry stepper; it has no product outcome to invoke
register: features/todo/handlers
