# Pomodoro — the reference recipe.
#
# It is deliberately small and deliberately complete: one table, one migration,
# one query file, one page, one write endpoint, one sidebar entry. Everything a
# recipe may own is here once, so the shape can be copied instead of invented.
#
# Install it from the repo root:
#
#   go run ./cmd/gogogo recipe install _extensions/pomodoro --yes
#
# `id` is the receipt name, the prefix every table must carry (`ext_pomodoro_`),
# and the id the generated registration and the policy block both key on.
id: pomodoro

# version is the author's version claim, vMAJOR.MINOR.PATCH. Install records
# it in the receipt, and `recipe outdated` compares it with the latest
# reviewed catalog entry. Omit it and outdated honestly reports unknown.
version: v0.1.0

# module is the module path the imports below were written against; install
# rewrites it to the target tree's own module.
module: github.com/calionauta/gogogo

# register is the package exporting `Register`. The generated registration calls
# it at boot, so the recipe's provider and its sidebar entry reach the seam
# without any core file naming the recipe.
register: features/pomodoro/handlers

upstream:
  repo: github.com/calionauta/gogogo
  ref: feat/recipe-extensions-spike
  path: _extensions/pomodoro

# declaration is the append-only half: what the code claims, checked against the
# code at install and at every `recipe status`. Tables must carry the id prefix;
# core tables are refused.
declaration:
  tables:
    - ext_pomodoro_sessions
  routes:
    - { method: GET, pattern: /pomodoro }
    - { method: POST, pattern: /api/pomodoro/sessions }
  slots:
    - nav.sidebar
