name: release-please

# Owns versioning. On every master push it opens (or updates) a
# "chore(master): release X.Y.Z" PR from the conventional commits since the last
# tag. A human merges it; the merge creates the tag and the GitHub Release, and
# the trailing dispatch step then builds the installer binaries.
#
# What it does NOT do: promote CHANGELOG [Unreleased] entries. release-please
# GENERATES the release notes from commits (changelog-type: github) and inserts
# the version section; nothing reads [Unreleased]. See AGENTS.md, "Releases".
#
# Agents must NEVER open a release PR or tag manually.
#
# Workflow runs on the release PR's branch sit in `action_required` until a
# maintainer approves them: the branch is pushed by a token, so GitHub holds the
# runs it triggers. That is not a nuisance to click past — it is how a test that
# could never pass stayed merged for months. `TestParseChangelogReadsTheRealFile`
# read the live CHANGELOG and hardcoded the version that happened to be newest,
# so the first release PR whose CI actually ran came back red on a job nobody had
# ever seen execute. Approve the runs, then read them.
#
# If you would rather they ran unattended, the fix is a PAT or GitHub App token
# for the action — but that also makes the tag push trigger release.yml directly
# (anti-recursion suppression is exactly what GITHUB_TOKEN provides), so the
# explicit dispatch step below must be removed in the same change or every
# release builds its binaries twice.
on:
  push:
    branches:
      - master

permissions:
  contents: write
  pull-requests: write
  # Needed for `gh workflow run` below: dispatching a workflow is an Actions
  # write. Without it the step dies with HTTP 403 "Resource not accessible by
  # integration", and the binaries silently never build (the bug this step
  # exists to fix).
  actions: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    steps:
      - uses: googleapis/release-please-action@v5
        id: release
        with:
          config-file: .github/release-please-config.json
          manifest-file: .github/.release-please-manifest.json

      # Tell the maintainer WHY the release PR's CI sits in `action_required`,
      # instead of leaving them to approve it blind.
      #
      # The approval itself is correct and must stay: this branch is pushed by a
      # token, so GitHub holds the runs it triggers, and that hold is the only
      # reason `TestParseChangelogReadsTheRealFile` was ever caught — it read the
      # live CHANGELOG, hardcoded whichever version happened to be newest, and
      # stayed green for months because CI never ran on this branch. The first
      # release PR whose CI actually executed came back red.
      #
      # The cost was never the click; it was that the click carried no
      # information. Six of sixty observed runs sat for up to twelve hours with
      # nothing saying what they protected, which reads as "CI is slow" and
      # trains everyone to click through. This comment fixes that by naming the
      # gate and the commit it guards. It is idempotent (one comment, updated in
      # place) so a PR touched on every master push does not become a wall.
      - name: Explain the approval this PR needs
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Only release-please owns a branch with this name, and most master
          # pushes just refresh the open PR rather than opening one — so an
          # absent PR is the normal case, not an error.
          head="release-please--branches--master"
          num=$(gh pr list -R "$GITHUB_REPOSITORY" --head "$head" \
            --state open --json number --jq '.[0].number // empty' || true)
          if [ -z "$num" ]; then
            echo "no open release PR; nothing to explain"
            exit 0
          fi

          # One comment, updated in place. The body carries this marker so the
          # next run finds it instead of stacking a second copy: a release PR
          # is touched on every master push.
          marker="<!-- release-please-ci-approval -->"

          # Quoted heredoc: nothing inside is expanded. An unquoted one turned
          # every `backtick` into a command substitution and silently stripped
          # it from the body, and `` `GITHUB_TOKEN` `` rendered as an empty
          # string — the note read "runs that a  triggers".
          body=$(cat <<'EOF'
          <!-- release-please-ci-approval -->
          **CI on this PR needs one approval, and it is worth the click.**

          The checks here sit in `action_required` because this branch is
          pushed by a token: GitHub holds runs that a `GITHUB_TOKEN` triggers,
          as an anti-recursion measure. Nothing is failing and nothing is slow.

          That hold is load-bearing. It is the only reason a real bug was ever
          caught in this repo: `TestParseChangelogReadsTheRealFile` read the live
          `CHANGELOG.md`, hardcoded whichever version happened to be newest, and
          stayed green for months because CI never ran on this branch. The first
          release PR whose CI actually executed came back red.

          So: open **Actions**, approve the run on this branch, then read it. If
          it is red, the release is wrong — do not merge past it.
          EOF
          )

          # --edit-last edits the authenticated user's last comment, and the bot
          # is the only commenter on this PR, so it is the marker comment. The
          # existence test uses a plain literal match rather than jq --arg:
          # `gh --jq` does not accept --arg, and passing it fails the step with
          # a usage error that reads like a permissions problem.
          if gh pr view "$num" -R "$GITHUB_REPOSITORY" --json comments \
            --jq '.comments[].body' | grep -qF "$marker"; then
            gh pr comment "$num" -R "$GITHUB_REPOSITORY" --body "$body" --edit-last >/dev/null
            echo "updated the approval note on PR #$num"
          else
            gh pr comment "$num" -R "$GITHUB_REPOSITORY" --body "$body" >/dev/null
            echo "added the approval note to PR #$num"
          fi

      # release-please creates the tag with GITHUB_TOKEN, and GitHub starts no
      # workflow run from an event that token produced (anti-recursion) — so
      # release.yml's `on: push: tags` never fires for it. workflow_dispatch is
      # the documented exception, so bridge it explicitly. Skipped when no
      # release was cut (the common case: most master pushes only refresh the
      # release PR).
      #
      # `-R` IS LOAD-BEARING, and its absence is why v0.51.0 shipped with zero
      # assets. `gh` infers the repository from the git remote, and this job has
      # no checkout step (the release-please action needs none), so the first
      # time this branch ever executed it died with "fatal: not a git
      # repository". It went unnoticed because the step only runs when
      # `release_created == 'true'` — i.e. exactly once per release, on the
      # merge of the release PR, and every other run was a green SKIP. The
      # repo was therefore never resolved for the one invocation that mattered.
      - name: Build release binaries
        if: ${{ steps.release.outputs.release_created == 'true' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.release.outputs.tag_name }}
        run: gh workflow run release.yml -R "$GITHUB_REPOSITORY" --ref master -f tag="$TAG"

      # Ship the release. A release is not "the code is on master": it is the
      # code AND the version, and production has to run both. release-please
      # pushes the tag with GITHUB_TOKEN, which starts no workflow run, so
      # deploy.yml's tag arm never fires for a release — and the release
      # COMMIT (CHANGELOG.md plus the version bump) matches no path in the
      # deploy allow-list, so the push arm does not fire either. Production
      # then served the new code labelled with the PREVIOUS version (v0.69.0's
      # code, 0.68.0's badge) until the next code push; the 30-minute
      # schedule was supposed to heal it, but GitHub runs schedules on its own
      # cadence (hours apart, observed), so "the badge is right eventually" was
      # the best the pipeline promised.
      #
      # workflow_dispatch is the documented exception to the GITHUB_TOKEN
      # anti-recursion rule — the same bridge the step above uses for the
      # installer binaries, and the same one that had to be added there when
      # v0.43.0–v0.50.0 shipped zero assets. Dispatching HERE (not the tag
      # push) also means the tag already exists when the deploy builds, so the
      # badge carries the released version the first time.
      - name: Deploy the released version
        if: ${{ steps.release.outputs.release_created == 'true' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.release.outputs.tag_name }}
        run: gh workflow run deploy.yml -R "$GITHUB_REPOSITORY" --ref master -f tag="$TAG"
