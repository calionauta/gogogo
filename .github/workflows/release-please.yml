name: release-please

# Owns versioning: on every master push, opens (or updates) a
# "chore: release X.Y.Z" PR promoting CHANGELOG [Unreleased] entries.
# A human merges it; the merge creates the tag, and release.yml
# (goreleaser, tag-driven) builds from there. Agents must NEVER open
# release PRs or tag manually — see AGENTS.md.
on:
  push:
    branches:
      - master

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    steps:
      - uses: googleapis/release-please-action@v4
        with:
          config-file: .github/release-please-config.json
          manifest-file: .github/.release-please-manifest.json
