name: release-please

# Owns versioning. On every master push it opens (or updates) a
# "chore(master): release X.Y.Z" PR from the conventional commits since the last
# tag. A human merges it; the merge creates the tag and the GitHub Release, and
# the trailing dispatch step then builds the installer binaries.
#
# What it does NOT do: promote CHANGELOG [Unreleased] entries. release-please
# GENERATES the release notes from commits (changelog-type: github) and inserts
# the version section; nothing reads [Unreleased]. See AGENTS.md, "Releases".
#
# Agents must NEVER open a release PR or tag manually.
#
# Workflow runs on the release PR's branch sit in `action_required` until a
# maintainer approves them: the branch is pushed by a token, so GitHub holds the
# runs it triggers. That is not a nuisance to click past — it is how a test that
# could never pass stayed merged for months. `TestParseChangelogReadsTheRealFile`
# read the live CHANGELOG and hardcoded the version that happened to be newest,
# so the first release PR whose CI actually ran came back red on a job nobody had
# ever seen execute. Approve the runs, then read them.
#
# If you would rather they ran unattended, the fix is a PAT or GitHub App token
# for the action — but that also makes the tag push trigger release.yml directly
# (anti-recursion suppression is exactly what GITHUB_TOKEN provides), so the
# explicit dispatch step below must be removed in the same change or every
# release builds its binaries twice.
on:
  push:
    branches:
      - master

permissions:
  contents: write
  pull-requests: write
  # Needed for `gh workflow run` below: dispatching a workflow is an Actions
  # write. Without it the step dies with HTTP 403 "Resource not accessible by
  # integration", and the binaries silently never build (the bug this step
  # exists to fix).
  actions: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    steps:
      - uses: googleapis/release-please-action@v5
        id: release
        with:
          config-file: .github/release-please-config.json
          manifest-file: .github/.release-please-manifest.json

      # release-please creates the tag with GITHUB_TOKEN, and GitHub starts no
      # workflow run from an event that token produced (anti-recursion) — so
      # release.yml's `on: push: tags` never fires for it. workflow_dispatch is
      # the documented exception, so bridge it explicitly. Skipped when no
      # release was cut (the common case: most master pushes only refresh the
      # release PR).
      #
      # `-R` IS LOAD-BEARING, and its absence is why v0.51.0 shipped with zero
      # assets. `gh` infers the repository from the git remote, and this job has
      # no checkout step (the release-please action needs none), so the first
      # time this branch ever executed it died with "fatal: not a git
      # repository". It went unnoticed because the step only runs when
      # `release_created == 'true'` — i.e. exactly once per release, on the
      # merge of the release PR, and every other run was a green SKIP. The
      # repo was therefore never resolved for the one invocation that mattered.
      - name: Build release binaries
        if: ${{ steps.release.outputs.release_created == 'true' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.release.outputs.tag_name }}
        run: gh workflow run release.yml -R "$GITHUB_REPOSITORY" --ref master -f tag="$TAG"
