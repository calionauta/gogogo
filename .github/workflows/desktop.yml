name: Desktop

on:
  pull_request:
    branches: [master]
    # Docs, markdown, rules/ and the site/ landing page cannot affect the
    # desktop shell.
    # src/css/input.css scans only features/, web/ and internal/, so site/ edits
    # no longer change the embedded web/resources/static/* either.
    paths-ignore:
      - "docs/**"
      - "site/**"
      - "**.md"
      - "LICENSE"
      - ".stelow/**"
      - ".gitignore"
      - "rules/**"
  push:
    branches: [master]
    paths-ignore:
      - "docs/**"
      - "site/**"
      - "**.md"
      - "LICENSE"
      - ".stelow/**"
      - ".gitignore"
      # rules/rules.go carries `//go:build ruleguard`, so it reaches only
      # golangci-lint — the desktop build uses plain `go build` and never
      # compiles it. Same reasoning as the deploy filter; measured there that a
      # rules-only commit otherwise paid a full 6-minute pipeline.
      - "rules/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  linux-desktop:
    # Wails v3's default Linux backend is GTK4 + WebKitGTK 6.0. Pin the
    # runner instead of relying on ubuntu-latest's changing package set.
    runs-on: ubuntu-24.04
    env:
      GOTOOLCHAIN: local
    steps:
      - uses: actions/checkout@v4
      - name: Install Go 1.27.1 manually
        # Keep the installation path aligned with web CI. setup-go has
        # intermittently produced a corrupted toolchain on GitHub runners.
        run: |
          curl -fsSL https://go.dev/dl/go1.27.1.linux-amd64.tar.gz -o /tmp/go.tgz
          sudo rm -rf /usr/local/go
          sudo tar -C /usr/local -xzf /tmp/go.tgz
          echo "/usr/local/go/bin" >> "$GITHUB_PATH"
          /usr/local/go/bin/go version
      - name: Install Wails Linux build dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y build-essential pkg-config libgtk-4-dev libwebkitgtk-6.0-dev
      - name: Verify Wails environment
        # Kept as an environment sanity check (GTK4/WebKitGTK headers present).
        # The build step itself no longer needs the CLI — desktop-build.sh
        # compiles with plain `go build`.
        run: |
          go install github.com/wailsapp/wails/v3/cmd/wails3@v3.0.0-beta.24
          "$(go env GOPATH)/bin/wails3" doctor
      - name: Generate templ
        run: go tool templ generate
      - name: Vet desktop target
        run: go vet ./cmd/desktop
      - name: Build desktop application
        # Uses plain `go build` — no wails3 CLI and no Taskfile required.
        run: ./scripts/desktop-build.sh

  cross-preview:
    # Opt-in multi-OS preview via wails-cross (ONE Linux runner builds win+mac+linux).
    # Worth it for: manual smoke before a release, without paying for three native
    # runners. NOT for: final release (darwin comes out UNSIGNED — sign on a macOS
    # runner). Only runs on workflow_dispatch so it does not weigh down PR/push.
    # ~800MB download the first time (cached by the Docker layer; setup is idempotent).
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    env:
      GOTOOLCHAIN: local
    steps:
      - uses: actions/checkout@v4
      - name: Install Go 1.27.1 manually
        run: |
          curl -fsSL https://go.dev/dl/go1.27.1.linux-amd64.tar.gz -o /tmp/go.tgz
          sudo rm -rf /usr/local/go
          sudo tar -C /usr/local -xzf /tmp/go.tgz
          echo "/usr/local/go/bin" >> "$GITHUB_PATH"
          /usr/local/go/bin/go version
      - name: Install Wails Linux build dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y build-essential pkg-config libgtk-4-dev libwebkitgtk-6.0-dev
      - name: Setup wails-cross image (one-time, cached)
        # Built from the wails source checkout — `wails3 task setup:docker`
        # cannot be used here because it requires a Taskfile.yml at the repo
        # root, which this repo does not have (make is the task runner).
        run: |
          git clone --depth 1 https://github.com/wailsapp/wails /tmp/wails-src
          docker build -t wails-cross \
            -f /tmp/wails-src/build/docker/Dockerfile.cross \
            /tmp/wails-src/build/docker/
      - name: Cross previews (windows + darwin + linux)
        run: |
          chmod +x scripts/desktop-build.sh
          ./scripts/desktop-build.sh cross-windows
          ./scripts/desktop-build.sh cross-darwin
          ./scripts/desktop-build.sh cross-linux
      - name: Upload cross previews (UNSIGNED)
        uses: actions/upload-artifact@v4
        with:
          name: desktop-cross-preview
          path: build/cross/

  gui-poc:
    # The gogpu/ui native POC (cmd/gui) is pure Go with zero CGO, so it
    # needs no system headers — but its GPU deps (wgpu/naga) are heavy,
    # so it is validated here instead of in web CI (web-packages.sh
    # excludes cmd/gui for the same reason it excludes cmd/desktop).
    # Tests run with the race detector (incl. the concurrent-access
    # test); the shipped binary builds with CGO_ENABLED=0 per the gogpu
    # ecosystem requirement (goffi fails the build otherwise).
    runs-on: ubuntu-24.04
    env:
      GOTOOLCHAIN: local
    steps:
      - uses: actions/checkout@v4
      - name: Install Go 1.27.1 manually
        run: |
          curl -fsSL https://go.dev/dl/go1.27.1.linux-amd64.tar.gz -o /tmp/go.tgz
          sudo rm -rf /usr/local/go
          sudo tar -C /usr/local -xzf /tmp/go.tgz
          echo "/usr/local/go/bin" >> "$GITHUB_PATH"
          /usr/local/go/bin/go version
      - name: Check formatting (gofumpt + goimports)
        run: |
          go run mvdan.cc/gofumpt@v0.12.0 -l cmd/gui/ | tee /tmp/gofumpt.out
          test ! -s /tmp/gofumpt.out
      - name: Vet gui target
        run: go vet ./cmd/gui/
      # NOTE (CI weight): no golangci-lint here on purpose. Linting the
      # wgpu/naga tree costs minutes cold on every push and only catches
      # style — it never catches breakage (vet+tests+build do that).
      # Run it locally before touching cmd/gui: `make lint-gui`.
      # Same precedent as cmd/desktop (vet+build only in this workflow).
      - name: Govulncheck gui target
        # Reachability check for the new FFI tree (goffi/wgpu/naga):
        # web CI's govulncheck sees these modules as unreachable, so
        # only this step tells whether gui actually calls a vuln symbol.
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          $(go env GOPATH)/bin/govulncheck ./cmd/gui/
      - name: Test gui backend wiring (headless, no window/GPU)
        run: go test -race -count=1 ./cmd/gui/
      - name: Build gui binary (headless check, no window opened)
        run: CGO_ENABLED=0 go build -o /tmp/gogogo-gui ./cmd/gui
