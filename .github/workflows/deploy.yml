# deploy.yml — production deploy to the user's own server
# (calionauta/fullstack.example.com via Tailscale).
#
# Trigger: a push to master that changes something the app is BUILT from.
#
# This used to be every push, which meant a README edit rebuilt the image,
# restarted the container and briefly took production down. The filter is an
# allow-list (paths, not paths-ignore) on purpose: a new top-level directory
# cannot silently start deploying, because a path that matters has to be added
# here explicitly. Docs, site/ and *.md are therefore excluded by construction.
#
# What the workflow does when it does run:
#   0. Reconciles first: compares the live `X-Gogogo-Build` header against
#      master HEAD (and the badge label against the latest tag) and skips the
#      deploy when production already runs the code. No lint/tests here —
#      ci.yml runs those in a separate workflow, in parallel, as validator
#      rather than gate: a master push ships without waiting for CI, so the
#      pre-merge PR check is the gate that actually runs before code lands.
#   1. Builds the production image ONCE and pushes it to the registry: a
#      human-readable tag plus a digest. The digest is the artifact's identity.
#   2. Brings up Tailscale in the GH runner (OIDC, scoped to this run)
#   3. Logs the server into the registry for that one pull, SCPs the compose
#      file, and renders the secrets file (mode 600) from GH Secrets, which
#      stay the single source of truth
#   4. SSHes in, moves the source clone to master, and runs
#      scripts/deploy-prod.sh, which PULLS the digest and restarts the
#      container — nothing is compiled on the server
#   5. Asserts that /health's X-Gogogo-Build names the commit that was built
#
# ONE artifact, named by digest: the bytes this pipeline built are the bytes
# production runs, and a rollback is "pull the previous digest" instead of
# "rebuild an older commit" (docs/deploy.md#rollback). Nothing is compiled in
# the runner and nothing is compiled on the server. An earlier revision
# cross-compiled a static binary in the runner and scp'd it to <APP_DIR>/bin,
# where nothing ever executed it — and nothing could have: the DB driver
# dlopens a musl library at first open, so a static binary panics with
# "Dynamic loading not supported" (the 0.44.0 production incident). Do not
# reintroduce a host-side binary: the container is the deployable, and
# scripts/smoke-prod-image.sh is what proves it boots.
#
# Secrets are NEVER stored long-term on the server: every deploy
# re-renders the secrets file from GitHub Actions secrets.
#
# Required GitHub Actions secrets (Settings > Secrets > Actions):
#   Tailscale (OIDC workload identity federation — no static secret):
#     TS_OAUTH_CLIENT_ID   Federated identity Client ID (from
#                          https://login.tailscale.com/admin/settings/identity)
#     TS_AUDIENCE          Federated identity Audience
#   SSH to the server:
#     DEPLOY_HOST           Tailscale hostname of the server
#                           (e.g. server.example.com or 100.x.x.x Tailscale IP)
#     DEPLOY_USER           the deploy user (e.g. 'deploy')
#     DEPLOY_SSH_KEY        private SSH key (PEM, the user only)
#   Demo runtime:
#     GOAI_API_KEY          Groq / OpenAI / OpenRouter key
#     ADMIN_UNLOCK_TOKEN    master password for the custom admin panel
#                           (set empty to disable the panel)
#
# The deploy job never echoes secrets. The .env file is written
# with mode 0600 and owned by the deploy user; the container
# reads it via env_file.

name: Deploy to production

on:
  push:
    branches: [master]
    paths:
      # Source. "**.go"/"**.templ" are safe (no site/ or docs/ Go code), but a
      # bare "**.css" would also match site/styles.css — the landing page's own
      # stylesheet, which is not embedded in the binary — and trigger a
      # production restart for a landing edit. CSS is enumerated per directory
      # instead.
      #
      # rules/rules.go is excluded for the same reason, and it is the one Go
      # file that qualifies: it carries `//go:build ruleguard`, so it is compiled
      # only by golangci-lint and never into the binary. A comment-only edit
      # there restarted production before this exclusion (verified: a commit
      # touching nothing else ran the full deploy). Enumerated below rather than
      # relying on "**.go" with the false positive left in.
      - "**.go"
      - "!rules/**"
      - "**.templ"
      - "go.mod"
      - "go.sum"
      - "package.json"
      - "package-lock.json"
      - "src/css/**"
      - "web/**/*.css"
      - "web/**"
      - "config/**"
      - "features/**"
      - "internal/**"
      - "cmd/**"
      # Deploy plumbing
      - "deploy/**"
      - "scripts/deploy-prod.sh"
      - "Makefile"
      - ".github/workflows/deploy.yml"

    # Tag pushes ALSO deploy, and this is what makes the version badge correct.
    #
    # The release flow is: push to master → CI must pass → tag → release. The
    # master-push deploy therefore runs BEFORE the tag exists, so its
    # `git describe --tags --abbrev=0` resolves to the PREVIOUS tag and the box
    # reports the old version while running the new code. Verified against a real
    # deploy log: the run for v0.36.1 printed
    #   "→ Building calionauta/gogogo v0.36.0 (commit e4a2206)"
    # for a commit that was tagged v0.36.1 minutes later.
    #
    # Re-deploying on the tag fixes the label, and the extra restart is the price
    # of not tagging before CI has passed — which would be worse, since a red CI
    # would already be on the tag. Note that GitHub does not evaluate path
    # filters for tag pushes, so a tag always deploys regardless of the paths
    # allow-list above.
    tags: ["v*"]
  workflow_dispatch:

  # Reconciliation: tag pushes made by release-please (GITHUB_TOKEN) do
  # not start workflow runs, so the tag-deploy arm below never fires and
  # the site badge would lag the release until the next code push. The
  # schedule closes that gap in two dimensions: the running build SHA vs
  # master HEAD (code drift), and the running badge version vs the latest
  # tag (label drift — same code, old label, e.g. header 0.47.0 serving
  # the v0.48.0 tree). Either mismatch deploys.
  schedule:
    - cron: "*/30 * * * *"

env:
  APP_NAME: ${{ github.event.repository.name }}

# Never run two deploys in parallel: pulling + restarting the container is
# racy, and two runs could otherwise interleave their digest's containers. The cancel-in-progress=false keeps the first
# deploy running until completion.
concurrency:
  group: prod-deploy
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  # ─────────────────────────────────────────────
  # 0. Reconcile: is production behind master HEAD?
  # ─────────────────────────────────────────────
  reconcile:
    runs-on: ubuntu-latest
    # Reading workflow runs needs Actions read (the top-level grants contents only).
    permissions:
      actions: read
      contents: read
    outputs:
      behind: ${{ steps.check.outputs.behind }}
    steps:
      - id: check
        run: |
          # Push, tag and manual events always deploy (existing behavior);
          # only the schedule consults the running build.
          if [ "${{ github.event_name }}" != "schedule" ]; then
            echo "behind=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          HEAD_SHA=$(git ls-remote "https://github.com/${{ github.repository }}.git" refs/heads/master | cut -c1-7)
          # Badge format X-Gogogo-Build: <version>-<short-sha>, pinned by
          # assertHealthCarriesBuildTag. Unparseable (site down, format
          # drift) fails open toward freshness: a needless redeploy is
          # cheap, a stale site is the bug.
          BUILD_TAG=$(curl -fsSL -D - -o /dev/null https://gogogo.calionauta.com/health 2>/dev/null | tr -d '\r' | grep -i '^x-gogogo-build:' | awk '{print $2}' || true)
          BADGE=$(printf '%s' "$BUILD_TAG" | rev | cut -d- -f1 | rev)
          # Badge version (everything before the trailing short SHA).
          BADGE_VER=$(printf '%s' "$BUILD_TAG" | rev | cut -d- -f2- | rev)
          # Latest release tag. Empty on ls-remote failure — the label
          # check below skips then rather than forcing a restart over an
          # infra hiccup.
          LATEST_TAG=$(git ls-remote --tags "https://github.com/${{ github.repository }}.git" 'v*.*.*' 2>/dev/null | grep -v '\^{}' | awk -F/ '{print $NF}' | sort -V | tail -1 || true)
          LATEST_VER="${LATEST_TAG#v}"
          # Last master SHA with green CI. Empty when the API fails or no run
          # exists yet — callers treat that as "unknown" (old HEAD-vs-badge
          # comparison), never as a reason to skip.
          GREEN_SHA=$(gh api "repos/${{ github.repository }}/actions/workflows/ci.yml/runs?branch=master&status=success&per_page=1" --jq '.workflow_runs[0] | select(.conclusion == "success") | .head_sha // empty' 2>/dev/null | cut -c1-7 || true)
          if [ -z "$HEAD_SHA" ]; then
            echo "behind=true" >> "$GITHUB_OUTPUT"
            echo "ls-remote failed; deploying to be safe"
            exit 0
          fi
          if [ "$BADGE" = "$HEAD_SHA" ]; then
            # Same code — but the label may still lag: the push-deploy runs
            # before the release tag exists, and the tag-deploy arm never
            # fires for release-please tags. Redeploy on version mismatch so
            # the badge reports what is actually running.
            if [ -n "$LATEST_VER" ] && [ -n "$BADGE_VER" ] && [ "$BADGE_VER" != "$LATEST_VER" ]; then
              echo "behind=true" >> "$GITHUB_OUTPUT"
              echo "production runs $BADGE_VER, latest tag is $LATEST_VER; redeploying for the label"
              exit 0
            fi
            echo "behind=false" >> "$GITHUB_OUTPUT"
            echo "production runs $BADGE = master HEAD; nothing to do"
            exit 0
          fi
          if [ -n "$GREEN_SHA" ] && [ "$HEAD_SHA" != "$GREEN_SHA" ]; then
            echo "behind=false" >> "$GITHUB_OUTPUT"
            echo "master HEAD $HEAD_SHA has no green CI yet (last green: $GREEN_SHA); skipping deploy until CI passes (recover with workflow_dispatch if the outage is infra, not code)"
            exit 0
          fi
          echo "behind=true" >> "$GITHUB_OUTPUT"
          echo "production runs ${BADGE:-unknown}, validated master is $HEAD_SHA; deploying"
  # ─────────────────────────────────────────────
  # 1. Build the artifact once (the image)
  # ─────────────────────────────────────────────
  # Build once, promote by digest. The deploy names the digest it verified, so
  # the bytes CI built are the bytes production runs; a rebuild on the server
  # would be a second, unverified article.
  image:
    needs: reconcile
    if: needs.reconcile.outputs.behind == 'true'
    # Native arm64: the image is built inside alpine, so the C toolchain and
    # the embedded musl platform library match the runtime, at native speed.
    # Public repos get this runner for free; a fork without arm runners can
    # switch to `ubuntu-latest` — the same build then runs through QEMU
    # (several times slower, same result).
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: read
      packages: write
    outputs:
      image_ref: ${{ steps.pin.outputs.image_ref }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Resolve image name and build stamp
        id: meta
        # The commit is shortened here, not by the Dockerfile, because the
        # build stamp is what /health reports and what the deploy asserts on.
        run: |
          repo="$(printf '%s' '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')"
          version="$(git describe --tags --abbrev=0 2>/dev/null | sed 's/^v//')"
          echo "image_repo=ghcr.io/${repo}" >> "$GITHUB_OUTPUT"
          echo "version=${version:-dev}" >> "$GITHUB_OUTPUT"
          echo "short_sha=$(printf '%s' '${{ github.sha }}' | cut -c1-7)" >> "$GITHUB_OUTPUT"
          echo "build_time=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/Dockerfile.prod
          platforms: linux/arm64
          push: true
          # Tags are labels for humans. Nothing deploys by tag.
          tags: |
            ${{ steps.meta.outputs.image_repo }}:sha-${{ steps.meta.outputs.short_sha }}
            ${{ steps.meta.outputs.image_repo }}:${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || 'master' }}
          build-args: |
            VERSION=${{ steps.meta.outputs.version }}
            COMMIT=${{ steps.meta.outputs.short_sha }}
            BUILDTIME=${{ steps.meta.outputs.build_time }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Pin the digest
        id: pin
        # The digest, not the tag, is what the server pulls: a tag can move, a
        # digest cannot. This is also the rollback handle.
        run: |
          echo "image_ref=${{ steps.meta.outputs.image_repo }}@${{ steps.build.outputs.digest }}" >> "$GITHUB_OUTPUT"

  # ─────────────────────────────────────────────
  # 2. Deploy the pinned digest via Tailscale SSH
  # ─────────────────────────────────────────────
  deploy:
    needs: [reconcile, image]
    env:
      # The artifact for this run: registry path + the digest CI just pushed.
      APP_IMAGE: ${{ needs.image.outputs.image_ref }}
      # The commit the artifact was built from. deploy-prod.sh refuses to
      # report success unless /health agrees, so a pull that silently did not
      # take effect fails the deploy instead of leaving the old container up.
      EXPECTED_COMMIT: ${{ github.sha }}
    runs-on: ubuntu-latest
    # Only on master push, a v* tag push, or manual dispatch (not on PRs).
    # The tag arm is required, not cosmetic: a tag push sets github.ref to
    # refs/tags/vX.Y.Z, so without it the job would be skipped and the deploy
    # triggered by the tag would build nothing.
    # behind-gate: this used to ride on the `build` job (a skipped dependency
    # skips the dependent job). With the build job gone the condition has to be
    # explicit, or every 30-minute schedule run would redeploy whether or not
    # production is already current.
    if: needs.reconcile.outputs.behind == 'true' && (github.ref == 'refs/heads/master' || startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch')
    # id-token: the Tailscale OIDC federated identity — the runner mints a JWT
    # for the Tailscale IdP to verify. packages: read lets the server's one-time
    # registry login resolve the digest.
    permissions:
      id-token: write
      contents: read
      packages: read

    steps:
      - uses: actions/checkout@v4

      - name: Bring up Tailscale in the runner
        # Uses OIDC Workload Identity Federation — the runner
        # authenticates to Tailscale with a short-lived JWT signed
        # by GitHub Actions. No static secret. Recommended by
        # Tailscale over OAuth clients.
        #
        # To set this up:
        #   1. Create a tag in your tailnet (e.g. `tag:continuous-integration`,
        #      which is the convention Tailscale's docs use) and
        #      grant it the access permissions the CI runner needs
        #      (e.g. SSH to the deploy user on the server).
        #   2. Create a federated identity at
        #      https://login.tailscale.com/admin/settings/identity
        #      (issuer: GitHub, audience: anything memorable, e.g.
        #      `ts-actions-deploy`). You'll get a Client ID and an
        #      Audience.
        #   3. Add the Client ID as TS_OAUTH_CLIENT_ID and the
        #      Audience as TS_AUDIENCE in GH Secrets.
        #   4. The `id-token: write` permission above is mandatory.
        uses: tailscale/github-action@v4
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          audience: ${{ secrets.TS_AUDIENCE }}
          tags: tag:continuous-integration
          args: --ssh

      # Render the secrets file (mode 600) BEFORE any container could read it.
      # The secrets come from GitHub Secrets, the single source of truth; the
      # file is regenerated on every deploy and never committed.
      #
      # GOAI_BASE_URL / GOAI_MODEL are GitHub Variables (not secrets — the
      # URL/model are not sensitive) so the demo can target Groq (or any
      # OpenAI-compatible provider) without editing code.
      - name: Write secrets file (mode 600)
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          GOAI_API_KEY: ${{ secrets.GOAI_API_KEY }}
          ADMIN_UNLOCK_TOKEN: ${{ secrets.ADMIN_UNLOCK_TOKEN }}
          GOAI_BASE_URL: ${{ vars.GOAI_BASE_URL }}
          GOAI_MODEL: ${{ vars.GOAI_MODEL }}
        run: |
          set -euo pipefail
          # Tailscale SSH (port 2222) on this server is in userspace
          # mode: it accepts the same authorized_keys as local sshd
          # but routes via the Tailscale tunnel (so we don't need
          # the public IP / port 22 to be reachable). The matching
          # public key was added to ~/.ssh/authorized_keys on the
          # server (no 'command=' prefix this time — we want a real
          # shell, not the forced deploy-prod invocation that the
          # other repo uses).
          mkdir -p ~/.ssh && chmod 0700 ~/.ssh
          # echo appends a newline; OpenSSH keys end with one anyway.
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/deploy_key
          chmod 0600 ~/.ssh/deploy_key
          ssh-keyscan -t ed25519 -p 2222 $DEPLOY_HOST >> ~/.ssh/known_hosts 2>/dev/null || true
          cat > ~/.ssh/config <<EOF
          Host $DEPLOY_HOST
            Port 2222
            StrictHostKeyChecking yes
            UserKnownHostsFile ~/.ssh/known_hosts
            IdentityFile ~/.ssh/deploy_key
            User $DEPLOY_USER
          EOF
          chmod 0600 ~/.ssh/config
          APP_NAME="${{ env.APP_NAME }}"
          APP_DIR="/home/deploy/services/${APP_NAME}"
          # The compose file's env_file points at this path. Keep the two in
          # sync: commit d2b2fec moved the compose side to ~/.secrets/ (the
          # server convention) but left this render going to <APP_DIR>/secrets/,
          # so the file landed where nothing read it and `docker compose up`
          # failed with "env file /home/deploy/.secrets/<app>.env not found" —
          # which the deploy script reported only as a healthcheck timeout.
          SECRETS_DIR="/home/deploy/.secrets"
          ssh $DEPLOY_HOST "set -euo pipefail
            # Free disk space before writing anything
            docker system prune -af --filter 'until=24h' 2>/dev/null || true
            docker builder prune -af 2>/dev/null || true
            # Application layout
            for d in compose env scripts; do
              mkdir -p \"${APP_DIR}/\${d}\"
            done
            # Convention rule 4: secrets live in ~/.secrets/, 0700, read by the
            # compose env_file.
            mkdir -p \"$SECRETS_DIR\"
            chmod 0700 \"$SECRETS_DIR\"
            umask 077
            cat > \"$SECRETS_DIR/${APP_NAME}.env.tmp\" <<EOF2
          GOAI_API_KEY=$GOAI_API_KEY
          GOAI_BASE_URL=${GOAI_BASE_URL:-https://openrouter.ai/api/v1}
          GOAI_MODEL=${GOAI_MODEL:-nvidia/nemotron-3-super-120b-a12b:free}
          ADMIN_UNLOCK_TOKEN=$ADMIN_UNLOCK_TOKEN
          EOF2
            mv \"$SECRETS_DIR/${APP_NAME}.env.tmp\" \"$SECRETS_DIR/${APP_NAME}.env\"
            chmod 0600 \"$SECRETS_DIR/${APP_NAME}.env\"
            echo '✓ secrets file written (mode 600)'
          "

      # SCP the compose file (overwriting the previous one).
      - name: Copy compose file
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
        run: |
          set -euo pipefail
          scp -P 2222 deploy/docker-compose.prod.yml $DEPLOY_HOST:/home/deploy/services/${{ env.APP_NAME }}/compose/docker-compose.prod.yml

      - name: Registry login for the pull
        # A package created by a private repository is private and the server's
        # pull needs a credential; a package whose repository is public is
        # pullable anonymously (verified on this one: an anonymous pull of a
        # non-existent tag answers "manifest unknown", not "unauthorized"). So
        # the login runs unless GHCR_PUBLIC=true — and it is BEST-EFFORT, because
        # the contract is the pull plus the build assertion further down, which
        # still fails the deploy loudly when a credential was needed and missing.
        # Fatal-only added a way for a needless step to stop a deploy, which is
        # exactly what happened when this secret's trailing whitespace reached
        # ssh through a quoted variable.
        #
        # The token is the run's repository token (`packages: read`); it travels
        # on ssh stdin (never on a command line, never in a file) and
        # deploy-prod.sh logs out on exit, so nothing survives the deploy.
        if: vars.GHCR_PUBLIC != 'true'
        continue-on-error: true
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
        run: |
          set -euo pipefail
          # This secret carries trailing whitespace. Unquoted use elsewhere in
          # the workflow word-splits it away by accident; quoting it does not,
          # and ssh then reports "hostname contains invalid characters". Strip it
          # here instead of depending on that accident.
          host="$(printf '%s' "$DEPLOY_HOST" | tr -d '[:space:]')"
          printf '%s' '${{ secrets.GITHUB_TOKEN }}' |
            ssh "$host" "docker login ${APP_IMAGE%%/*} -u '${{ github.actor }}' --password-stdin"

      # Ensure the directory layout exists, update the source clone (needed for
      # the deploy script and the app's .env), then run the deploy script
      # (digest pull + container restart + health wait + build assertion).
      - name: Ensure layout + run deploy
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
        run: |
          set -euo pipefail
          ssh $DEPLOY_HOST "set -euo pipefail
            APP_NAME=\"${{ env.APP_NAME }}\"
            APP_DIR=\"/home/deploy/services/\${APP_NAME}\"
            for d in compose env scripts; do
             mkdir -p \"\${APP_DIR}/\${d}\"
           done

            if [ ! -d \"/home/deploy/services/\${APP_NAME}/repo\" ]; then
              git clone \"https://github.com/${{ github.repository }}.git\" \"/home/deploy/services/\${APP_NAME}/repo\"
            else
              git -C \"/home/deploy/services/\${APP_NAME}/repo\" fetch origin
              git -C \"/home/deploy/services/\${APP_NAME}/repo\" reset --hard origin/master
            fi

            cp \"/home/deploy/services/\${APP_NAME}/repo/.env\" \"\${APP_DIR}/env/.env\" 2>/dev/null || true
            cp \"/home/deploy/services/\${APP_NAME}/repo/scripts/deploy-prod.sh\" \"\${APP_DIR}/scripts/deploy-prod.sh\"
            chmod 0700 \"\${APP_DIR}/scripts/deploy-prod.sh\"

            APP_IMAGE='${APP_IMAGE}' EXPECTED_COMMIT='${EXPECTED_COMMIT}' bash \"\${APP_DIR}/scripts/deploy-prod.sh\"
          "
