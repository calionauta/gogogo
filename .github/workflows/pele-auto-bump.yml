name: pele-auto-bump

# Opens (or updates) a PR that moves the vendored Pele bundle to the newest
# release.
#
# Why a PR and not an auto-commit: that bundle is what turns a mermaid fence in
# a Chat answer into SVG. Every diagram the demo renders goes through it, so a
# silent bump would change what users see with nobody reading the diff.
#
# The pin test (web/resources/pele_version_test.go) is the check — the bundle's
# own banner and pinnedPele must agree. scripts/bump-pele.sh is the writable
# half: it resolves the release, verifies the banner, replaces the asset and
# bumps the constant. The sizes the docs quote are then regenerated by
# `go run ./cmd/check-docs -write`, so this workflow never types a number.
#
# Same shape as daisyui-auto-bump.yml, and the same reason: vendored copies are
# normative, so the update is one review away instead of automatic.

on:
  schedule:
    # Thursdays at 09:41 UTC — off the daily jobs, and after Wednesday's
    # stelow/daisyui checks so a failure is not lost in a burst.
    - cron: "41 9 * * 4"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

env:
  # The toolchain comes from bin/install-go-toolchain.sh; never let go fetch
  # one of its own.
  GOTOOLCHAIN: local

jobs:
  bump:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # Needed so the branch can be pushed back.
          persist-credentials: true

      # Same reason as ci.yml: actions/setup-go's tar extraction has been
      # corrupting the toolchain on this runner image.
      - name: Install the pinned Go toolchain
        run: bash bin/install-go-toolchain.sh

      - name: Probe upstream
        id: probe
        run: |
          set -o pipefail
          out=$(scripts/bump-pele.sh --dry-run 2>&1) || { echo "$out"; exit 1; }
          echo "$out"
          if grep -q "already current" <<<"$out"; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "Already at the newest release — nothing to bump."
            exit 0
          fi
          echo "changed=true" >> "$GITHUB_OUTPUT"
          move=$(grep -oE "Pele [0-9.]+ -> [0-9.]+" <<<"$out" | tail -1)
          echo "from=$(awk '{print $2}' <<<"$move")" >> "$GITHUB_OUTPUT"
          echo "to=$(awk '{print $4}' <<<"$move")" >> "$GITHUB_OUTPUT"

      - name: Bump the bundle, the pin and the measured sizes
        if: steps.probe.outputs.changed == 'true'
        id: bump
        run: |
          set -o pipefail
          scripts/bump-pele.sh
          echo "PIN=$(grep -oE 'pinnedPele = "[^"]*"' web/resources/pele_version_test.go | cut -d'"' -f2)" >> "$GITHUB_OUTPUT"
          sizes=$(git diff -U0 docs/features.md | grep '^+| Chat diagrams' \
            | sed -E 's/.*\| ([0-9]+ KB) \| ([0-9]+ KB) \|.*/\1 raw · \2 gzip/' | head -1)
          echo "sizes=${sizes:-unchanged}" >> "$GITHUB_OUTPUT"

      - name: Prove the pin and the docs
        if: steps.probe.outputs.changed == 'true'
        run: |
          set -o pipefail
          go test ./web/resources/ -run 'TestPeleVersionIsPinned|TestDiagramHelperPresent'
          go run ./cmd/check-docs

      - name: Open or update the bump PR
        if: steps.probe.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          FROM="${{ steps.probe.outputs.from }}"
          TO="${{ steps.bump.outputs.PIN }}"
          BRANCH="chore/pele-${TO}"

          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # One branch per version, so a re-run updates the same PR instead of
          # opening a second one for the release it already proposed.
          git checkout -B "$BRANCH"
          git add web/resources/static/pele.global.js web/resources/pele_version_test.go docs/features.md site/index.html
          if git diff --cached --quiet; then
            echo "Nothing staged — skipping PR."
            exit 0
          fi
          git commit -F - <<EOF
          chore(deps): bump vendored Pele from ${FROM} to ${TO}

          Replaces web/resources/static/pele.global.js with the ${TO} release and
          bumps pinnedPele in the same commit, which is what the pin test
          requires. The sizes the docs quote are regenerated from the new bytes
          by `go run ./cmd/check-docs -write`.

          Verified by `go test ./web/resources/ -run TestPeleVersionIsPinned`
          and `go run ./cmd/check-docs`.
          EOF

          git push --force-with-lease origin "$BRANCH"

          BODY=$(cat <<EOF
          Automated bump of the vendored **Pele** Mermaid renderer.

          - **Version:** \`${FROM}\` → \`${TO}\`
          - **Files:** \`web/resources/static/pele.global.js\`, the pin in
            \`web/resources/pele_version_test.go\`, and the regenerated numbers in
            \`docs/features.md\` + the landing
          - **Weight:** ${{ steps.bump.outputs.sizes }}

          > ⚠️ This bundle draws every diagram in a Chat answer. Read the diff:
          > the theme comes from CSS variables (\`--pele-*\`), so a colour or
          > layout change lands here.

          The pin test passed (\`TestPeleVersionIsPinned\`), the helper contract
          still holds (\`TestDiagramHelperPresent\`), and \`check-docs\` reports
          that the quoted sizes match the bytes. CI runs the full gate,
          including the browser smoke that renders a diagram.

          Opened by \`.github/workflows/pele-auto-bump.yml\`.
          EOF
          )

          if gh pr view "$BRANCH" --json number >/dev/null 2>&1; then
            gh pr edit "$BRANCH" --body "$BODY"
            echo "Updated existing PR for $BRANCH."
          else
            gh pr create \
              --title "chore(deps): bump vendored Pele from ${FROM} to ${TO}" \
              --body "$BODY" \
              --head "$BRANCH" \
              --base "${GITHUB_REF_NAME}"
          fi
