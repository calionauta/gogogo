name: diag-oidc
# TEMPORARY diagnostic. Deleted after use.
on:
  workflow_dispatch:
permissions:
  id-token: write
  contents: read
jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install tailscale CLI
        run: |
          curl -fsSL https://pkgs.tailscale.com/stable/ubuntu/noble.noarmor.gpg | sudo tee /usr/share/keyrings/tailscale-archive-keyring.gpg >/dev/null
          curl -fsSL https://pkgs.tailscale.com/stable/ubuntu/noble.tailscale-keyring.list | sudo tee /etc/apt/sources.list.d/tailscale.list >/dev/null
          sudo apt-get update -qq && sudo apt-get install -y -qq tailscale
          tailscale version
      - name: Exchange via the daemon (verbose error)
        env:
          CID: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          AUD: ${{ secrets.TS_AUDIENCE }}
        run: |
          TOKEN=$(curl -sS -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=$AUD" | jq -r .value)
          echo "$TOKEN" | cut -d. -f2 | base64 -d 2>/dev/null | jq -c '{sub,ref}'
          echo "=== tags the workflow advertises ==="
          grep -n "tags:" .github/workflows/deploy.yml
          echo "=== tailscale up (verbose) ==="
          sudo tailscaled --tun=userspace-networking --state=/tmp/ts.state &
          sleep 6
          sudo tailscale up \
            --client-id="${CID}?preauthorized=true&ephemeral=true" \
            --id-token="$TOKEN" \
            --advertise-tags=tag:continuous-integration \
            --accept-routes --hostname=diag 2>&1 | tail -20 || true
