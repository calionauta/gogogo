name: diag-oidc
# TEMPORARY diagnostic. Deleted after use.
on:
  workflow_dispatch:
permissions:
  id-token: write
  contents: read
jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - name: Check client ID and audience consistency
        env:
          CID: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          AUD: ${{ secrets.TS_AUDIENCE }}
        run: |
          set -e
          echo "CID length: ${#CID}"
          echo "AUD length: ${#AUD}"

          # Tailscale generates the audience as: api.tailscale.com/<client ID>
          PREFIX="api.tailscale.com/"
          EXPECTED="${PREFIX}${CID}"

          echo "AUD starts with '${PREFIX}': $([ "${AUD#$PREFIX}" != "$AUD" ] && echo yes || echo no)"
          echo "AUD == api.tailscale.com/CID : $([ "$AUD" = "$EXPECTED" ] && echo YES || echo NO)"

          # Fingerprints so nothing secret is printed but the pair is comparable.
          fp() { printf '%s' "$1" | sha256sum | cut -c1-16; }
          echo "CID fingerprint: $(fp "$CID")"
          echo "AUD fingerprint: $(fp "$AUD")"
          echo "EXPECTED fingerprint: $(fp "$EXPECTED")"

          if [ "$AUD" = "$EXPECTED" ]; then
            echo "RESULT: client ID and audience are a MATCHING PAIR (same federated identity)"
          else
            echo "RESULT: MISMATCH — the audience does not belong to this client ID."
            echo "        A new federated identity was probably created instead of"
            echo "        editing the existing one, leaving one of the two secrets stale."
          fi
