name: diag-oidc
# TEMPORARY diagnostic. Deleted after use.
on:
  workflow_dispatch:
permissions:
  id-token: write
  contents: read
jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - name: Find the working exchange shape and print the real error
        env:
          CID: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          AUD: ${{ secrets.TS_AUDIENCE }}
        run: |
          TOKEN=$(curl -sS -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=$AUD" | jq -r .value)
          echo "token bytes: ${#TOKEN}"
          printf '%s' "$TOKEN" > /tmp/jwt.txt
          echo "$TOKEN" | cut -d. -f2 | base64 -d 2>/dev/null | jq -c '{sub,aud,iss,ref}'

          echo "=== tag used by the workflow ==="
          grep -n "tags:" .github/workflows/deploy.yml || true

          try() {
            local label="$1"; shift
            echo "--- $label ---"
            curl -sS -o /tmp/resp.txt -w "status=%{http_code}\n" \
              -X POST "https://api.tailscale.com/api/v2/oauth/token-exchange" \
              -H "Content-Type: application/x-www-form-urlencoded" "$@"
            head -c 400 /tmp/resp.txt; echo
          }

          # Shape A: documented (client_id + id_token)
          try "A: client_id+id_token" \
            --data-urlencode "client_id=$CID" \
            --data-urlencode "id_token@/tmp/jwt.txt" \
            --data-urlencode "grant_type=urn:ietf:params:oauth:grant-type:token-exchange" \
            --data-urlencode "audience=$AUD"

          # Shape B: RFC 8693 (subject_token)
          try "B: subject_token" \
            --data-urlencode "client_id=$CID" \
            --data-urlencode "subject_token@/tmp/jwt.txt" \
            --data-urlencode "subject_token_type=urn:ietf:params:oauth:token-type:jwt" \
            --data-urlencode "grant_type=urn:ietf:params:oauth:grant-type:token-exchange" \
            --data-urlencode "audience=$AUD"

          # Shape C: without audience
          try "C: no audience" \
            --data-urlencode "client_id=$CID" \
            --data-urlencode "id_token@/tmp/jwt.txt" \
            --data-urlencode "grant_type=urn:ietf:params:oauth:grant-type:token-exchange"
