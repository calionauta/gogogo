name: release

# Builds the prebuilt installer binaries (GoReleaser) for a released tag.
#
# Two triggers, and the second is load-bearing:
#
#   * `push: tags: v*` — a hand-cut tag (`git tag vX.Y.Z && git push --tags`).
#   * `workflow_dispatch` — the bridge from release-please, which passes the tag.
#
# Why the bridge exists: release-please creates the tag with the workflow's
# GITHUB_TOKEN, and GitHub does not start a workflow run from an event a
# GITHUB_TOKEN produced (anti-recursion). So `push: tags` alone NEVER fires for
# a release-please tag — v0.43.0 through v0.50.0 shipped with zero assets and
# `install.sh` 404'd for eight releases (verified: `gh release view <tag>
# --json assets`, and the tarball URL returns 404). `workflow_dispatch` and
# `repository_dispatch` are the documented exceptions to that rule, so
# release-please.yml dispatches this workflow after it cuts a release.
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        # release-please's `tag_name` output, e.g. v0.51.0. Required because a
        # dispatch checks out the default branch, not the tag.
        description: "Tag to build (e.g. v0.51.0)"
        required: true
        type: string

permissions:
  contents: write

jobs:
  goreleaser:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          # A dispatch checks out master by default, where `git describe` would
          # resolve the PREVIOUS tag and name every asset for it. Check out the
          # dispatched tag explicitly; a tag push already has the right ref.
          ref: ${{ inputs.tag || github.ref }}

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Release
        uses: goreleaser/goreleaser-action@v6
        with:
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
