name: CI
on:
  push:
    branches: [master]
  pull_request:
    # No base-branch filter on purpose. With `branches: [master]` a pull
    # request whose base is another branch — a stacked PR — triggered no
    # CI at all: the required `ci` status never appeared, and the change
    # under it could only be judged by reading the diff (PR #154 shipped
    # that way). A PR against any base now gets the same gates.
  workflow_dispatch:
    inputs:
      scope_packages:
        # Verifies the NARROW branch of the test selection on demand: a normal
        # PR only reaches it when the changeset is Go-only, and the plumbing
        # fail-open means this workflow's own PRs never do. Space or comma
        # separated package dirs.
        description: 'Package dirs to run instead of the classified scope (verifies the narrow path)'
        required: false
        default: ''
concurrency:
  # Cancel in-progress runs when a newer commit lands on the same ref (push+
  # PR both trigger on the same branch, so without this every push to a branch
  # with an open PR runs CI twice). Cheap fail-fast: a superseded commit's run
  # is wasted compute. Group on the head ref so PRs and master don't clobber
  # each other.
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
env:
  # Pipe, not comma: a dead proxy falls back to direct git on ANY error
  # (comma only falls back on 404/410, so a proxy INTERNAL_ERROR is fatal).
  # Verified empirically on go1.27.2 (dead-proxy probe: comma fails, pipe
  # fetches). Sumdb verification is unchanged — fallback never skips hashes.
  GOPROXY: https://proxy.golang.org|direct
jobs:
  # CI runs as a one-job changeset classifier followed by four parallel gate
  # jobs, one concern each — wall-clock is the slowest job, not the sum. Each
  # job repeats checkout + Go install (~1min of accepted duplication) to stay
  # independent and individually retryable.
  # These runners are GitHub-hosted (4vCPU/16GB each); do NOT copy this
  # fan-out onto a small self-hosted box — local `make ci-local` keeps its
  # host-capacity gates for exactly that reason.
  changes:
    # Changeset classifier: docs-only changes (docs/, site/, markdown,
    # LICENSE, stelow notes, .gitignore) cannot affect the Go build or the
    # embedded CSS — docs/*.md is validated by pages.yml (site-check) and
    # the pre-commit hooks, and src/css/input.css no longer scans site/.
    # The heavy jobs below skip on docs-only, but this workflow ALWAYS
    # runs so the required `ci` status still reports (a trigger-level
    # paths-ignore would skip the whole workflow and leave `ci` pending
    # forever on docs PRs — the exact failure this replaces).
    # Owned git-diff logic, no third-party action: PRs diff base...HEAD,
    # pushes diff before...after, anything else (dispatch, shallow
    # weirdness) fails open to a full run.
    runs-on: ubuntu-latest
    outputs:
      docs_only: ${{ steps.filter.outputs.docs_only }}
      # pkgs: the packages the race suite must run, newline-separated, already
      # expanded to their transitive dependents. Empty means "no Go package is
      # affected". Written by the scope step below; consumed by the race job.
      pkgs: ${{ steps.scope.outputs.pkgs }}
      scope_kind: ${{ steps.scope.outputs.kind }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - id: filter
        run: |
          set -euo pipefail
          BASE=""
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            BASE="${{ github.event.pull_request.base.sha }}"
          elif [ "${{ github.event_name }}" = "push" ]; then
            BASE="${{ github.event.before }}"
          fi
          # Fail OPEN: docs_only flips to true only when a diff was read
          # AND every path in it is inert. A missing base (force-push,
          # shallow history, dispatch) or a failed `git diff` leaves it
          # false, because skipping the gates on an unreadable changeset
          # would hide a real break instead of wasting a runner.
          DOCS_ONLY="false"
          if [ -n "$BASE" ] && [ "$BASE" != "0000000000000000000000000000000000000000" ] \
            && git cat-file -e "$BASE^{commit}" 2>/dev/null; then
            CHANGED="$(git diff --name-only "$BASE...HEAD" || true)"
            if [ -n "$CHANGED" ] && ! printf '%s\n' "$CHANGED" | grep -qvE '^docs/|^site/|\.md$|^LICENSE$|^\.stelow/|^\.gitignore$'; then
              DOCS_ONLY="true"
            fi
          fi
          echo "docs_only=$DOCS_ONLY" >> "$GITHUB_OUTPUT"
          echo "docs-only changeset: $DOCS_ONLY"
      - if: steps.filter.outputs.docs_only != 'true'
        name: Install the pinned Go toolchain manually
        # The scope step below shells out to scripts/changed-packages.sh, which
        # runs `go list`. Leaving that to the runner's preinstalled Go is the
        # failure bin/check-ci-deps.sh exists to prevent — it cannot see a `go`
        # call made inside a script, and an older runner Go would answer a
        # DIFFERENT question than the pinned toolchain the gates use (or try to
        # fetch one mid-step).
        run: |
          bash bin/install-go-toolchain.sh
      - if: steps.filter.outputs.docs_only != 'true'
        name: Restore Go module download cache
        # This job is the serial prefix on EVERY other job (`needs: [changes]`),
        # so its cost is the wall's cost. It was 60s, 50s of it a cold
        # `go mod download`; with the zip cache restored it is ~10s.
        uses: actions/cache@v4
        continue-on-error: true
        with:
          path: ~/go/pkg/mod/cache/download
          key: go-mod-dl-${{ runner.os }}-${{ hashFiles('go.mod', 'go.sum') }}
          restore-keys: |
            go-mod-dl-${{ runner.os }}-
      - if: steps.filter.outputs.docs_only != 'true'
        name: Warm module cache
        # `go list` resolves the module graph; the proxy answers storms with
        # transient INTERNAL_ERRORs that go does not retry on its own.
        run: bash bin/go-mod-download.sh
      - id: scope
        if: steps.filter.outputs.docs_only != 'true'
        # Test selection, PR-only. A merged commit always runs the full suite:
        # an error in the selection then cannot accumulate silently across PRs,
        # and a master push does not block anything (deploy runs in parallel).
        # Everything here fails OPEN to the full list — an unreadable diff, a
        # missing base or a broken classifier must cost a runner, never a
        # regression.
        run: |
          set -euo pipefail
          emit() { printf 'pkgs<<PKGS_EOF\n%s\nPKGS_EOF\n' "$1" >> "$GITHUB_OUTPUT"; }
          full() { bash scripts/web-packages.sh; }

          # An explicit list from workflow_dispatch short-circuits everything
          # below. It is the verification knob for the narrow path, and a way to
          # reproduce a specific shard's scope without a PR.
          #
          # The trailing newline in the printf is load-bearing: without it the
          # last entry is not read back (measured: two packages in, one out),
          # and a silently short scope is exactly the class of bug the
          # fail-opens below exist for.
          EXPLICIT="${{ inputs.scope_packages }}"
          if [ -n "$EXPLICIT" ]; then
            emit "$(printf '%s\n' "$EXPLICIT" | tr ' ,' '\n\n' | while IFS= read -r p; do
              [ -n "$p" ] && [ -d "$p" ] && (cd "$p" && pwd)
            done)"
            echo "kind=narrow" >> "$GITHUB_OUTPUT"
            echo "scope: explicit packages from the dispatch input"
            exit 0
          fi

          if [ "${{ github.event_name }}" != "pull_request" ]; then
            emit "$(full)"
            echo "kind=all" >> "$GITHUB_OUTPUT"
            echo "scope: not a PR, running every package"
            exit 0
          fi

          BASE="${{ github.event.pull_request.base.sha }}"
          if [ -z "$BASE" ] || [ "$BASE" = "0000000000000000000000000000000000000000" ] \
            || ! git cat-file -e "$BASE^{commit}" 2>/dev/null; then
            emit "$(full)"
            echo "kind=all" >> "$GITHUB_OUTPUT"
            echo "scope: base commit unreadable, running every package"
            exit 0
          fi

          SELECTED=$(BASE="$BASE" bash scripts/changed-packages.sh --with-dependents || true)

          # The test harness and the CI plumbing are shared inputs that no Go
          # package owns, and the closure seeds only .go/.templ files — so a PR
          # touching scripts/ or .github/ selects NOTHING (measured: this repo's
          # own CI changes did exactly that). Selecting nothing is not "nothing
          # can break", it is "the selector cannot see it": widen instead.
          # .sql belongs here for the same reason and a sharper one: migrations
          # under internal/dbschema are go:embed-ed into the binary and applied
          # at boot, and queries under internal/db regenerate sqlcgen, so a
          # SQL-only changeset can change what every DB-touching test sees
          # while seeding no package at all.
          # Anchored per alternative, not around the group: `^(\.sql$)` would
          # only match a file literally named ".sql" (measured — the first
          # version of this line was wrong and a test caught it).
          PLUMBING='(^\.github/|^\.githooks/|^scripts/|^bin/|^Makefile$|^\.lefthook\.yml$|\.sql$)'
          CHANGED=$(git diff --name-only "$BASE...HEAD" 2>/dev/null || true)
          if [ -n "$CHANGED" ] && printf '%s\n' "$CHANGED" | grep -qE "$PLUMBING"; then
            SELECTED=$(full)
            echo "scope: changeset touches CI plumbing, running every package"
          fi

          # A path that does not exist on this runner means the classifier and
          # the consumer disagree about the workspace; treat it as unclassified
          # rather than running `go test` against a directory that is not there.
          if [ -n "$SELECTED" ] && ! printf '%s\n' "$SELECTED" | while IFS= read -r p; do
            [ -d "$p" ] || exit 1
          done; then
            SELECTED=$(full)
          fi
          emit "$SELECTED"
          if [ -z "$SELECTED" ]; then
            echo "kind=none" >> "$GITHUB_OUTPUT"
            echo "scope: no Go package affected"
          elif [ "$(printf '%s\n' "$SELECTED" | wc -l)" -ge "$(full | wc -l)" ]; then
            echo "kind=all" >> "$GITHUB_OUTPUT"
            echo "scope: every package selected"
          else
            echo "kind=narrow" >> "$GITHUB_OUTPUT"
            echo "scope: $(printf '%s\n' "$SELECTED" | wc -l) of $(full | wc -l) packages"
          fi
  checks:
    needs: [changes]
    if: needs.changes.outputs.docs_only != 'true'
    runs-on: ubuntu-latest
    env:
      GOTOOLCHAIN: local
    steps:
      - uses: actions/checkout@v7
      - name: Install the pinned Go toolchain manually
        # actions/setup-go extracts the toolchain via tar and has been
        # intermittently corrupting it on this runner image. Install the
        # official stable tarball from go.dev into /usr/local/go instead,
        # which is a separate, reliable path. Version must match the
        # `go` directive in go.mod (bumped for GO-2026 stdlib CVEs).
        run: |
          bash bin/install-go-toolchain.sh
      - name: Restore Go build cache
        # Same guardrail as the race job: explicit actions/cache@v4 (JS/zstd
        # restore, not /usr/bin/tar — see commit d50d0fb for the flake this repo
        # turned caching off over) and continue-on-error, so an infra failure
        # costs a cold build instead of a red gate.
        uses: actions/cache@v4
        continue-on-error: true
        with:
          path: ~/.cache/go-build
          key: go-build-${{ runner.os }}-${{ github.job }}-${{ strategy.job-index }}-${{ hashFiles('go.mod', 'go.sum') }}
          restore-keys: |
            go-build-${{ runner.os }}-${{ github.job }}-
      - name: Restore Go module download cache
        # Only ~/go/pkg/mod/cache/download (the zips), not the extracted tree.
        # Measured: caching the whole module directory was break-even to a loss
        # (23-33s restore vs 16-29s download). This is roughly a third of that
        # size, and with the zips present `go mod download` extracts locally
        # instead of going to the proxy.
        uses: actions/cache@v4
        continue-on-error: true
        with:
          path: ~/go/pkg/mod/cache/download
          key: go-mod-dl-${{ runner.os }}-${{ hashFiles('go.mod', 'go.sum') }}
          restore-keys: |
            go-mod-dl-${{ runner.os }}-
      - name: Warm module cache
        # Cold runners download the full graph; the proxy answers storms
        # with transient INTERNAL_ERRORs, which go does not retry itself.
        run: bash bin/go-mod-download.sh
      - name: Generate templ
        run: go tool templ generate
      - name: Check generated templ files are committed
        # `_templ.go` is COMMITTED (so a checkout builds without the templ
        # toolchain). Editing a .templ and forgetting to regenerate ships a
        # binary rendering the OLD markup — and every other step here passes,
        # because they all build from the committed _templ.go. Same class of
        # bug as a stale CSS bundle. Cheap (one diff), so it stays in the
        # fail-fast block. `templ generate` is idempotent, so this cannot flake.
        run: |
          if ! git diff --quiet --exit-code -- '*_templ.go'; then
            echo "❌ committed _templ.go does not match the .templ sources."
            echo "   Run 'make templ' and COMMIT the regenerated files."
            git diff --stat -- '*_templ.go'
            exit 1
          fi
          echo "✓ generated templ files match their sources"
      - name: MCP module tests
        # cmd/gogogo-mcp is its own module, so the root `go test ./...` and the
        # race suite never see it. Nothing ran this module's tests, which is how
        # add_unit/new_feature shipped passing a flag their subcommands never
        # defined: every MCP call to them failed at flag parse and no gate
        # noticed. Same script as the local hook (make check-mcp).
        run: |
          cd cmd/gogogo-mcp
          bash ../../bin/go-mod-download.sh
          go test -count=1 ./...
      - name: Check install.sh bootstrap contract
        # install.sh is the first thing a new user runs and manipulates PATH.
        # Guards that it never plants a `go` entry in $BIN_DIR (which would
        # shadow a system Go) and that the bootstrapped toolchain is reachable.
        # Cheap (grep + sh -n), so it stays at the top of the cheap fail-fast
        # block.
        run: bin/check-install-sh.sh
      - name: Shard split contract
        # The selector decides WHICH tests run, so its own test pins that the
        # union of every shard is exactly web-packages.sh (no gap, no duplicate),
        # that the measured outlier gets a shard to itself, and that an empty
        # scope prints zero bytes — a blank line reaches `go test` as the
        # current directory. Synthetic universe: no repo, no go list, instant.
        run: bash scripts/ci-shard-packages.test.sh
      - name: Check-scope (SCOPE annotations)
        # Fast fail: validate annotations before heavy C toolchain installs
        run: go run ./cmd/check-scope
      - name: Standalone binaries (dogfood)
        # check-classes is the gate; this proves the shipped CLIs still run on a
        # real tree — the product has users outside this repo.
        run: |
          make daisyui-lint
          go run ./cmd/ui-registry list > /dev/null
      - name: Check-classes (markup ↔ stylesheet ↔ doc)
        # The UI rules as a gate: an app-*/ui-* class must exist in chrome.css
        # and be used, the kit table must match, and the DaisyUI part rules
        # (toggle on an <input>, join-item inside a join, dropdown-content
        # inside a dropdown) hold. Cheap (text + one regex pass).
        run: go run ./cmd/check-classes
      - name: Check-flatdeps (flat-stack dependencies)
        # Same gate as `make check-flatdeps` and the pre-commit
        # flatdeps-lint job: no banned framework in the closure, no
        # cross-feature domain imports, sql.Open only in owner packages.
        run: go run ./cmd/check-flatdeps
      - name: Check-docs (prose claims)
        # Same gate as `make check-docs` and the pre-commit docs-claims job:
        # no hand-written capability/slice/unit counts, every concrete repo
        # path alive, every `gogogo <sub>` real, every docs page in the
        # site MANIFEST.
        run: go run ./cmd/check-docs
      - name: Check-secrets-env (secret env sites)
        # Same gate as `make check-secrets-env` and the pre-commit
        # secrets-env job: secret-shaped env reads only in owner files
        # (config loader, secrets loader, narrow allowlist).
        run: go run ./cmd/check-secrets-env
      - name: Check-test-value (tests pin behavior)
        # Same gate as `make check-test-value` and the pre-commit test-value
        # job: no vacuous Test (fails only on panic). -quiet here: err-only
        # warnings are the review aid in `make cover-diff`, not CI signal.
        run: go run ./cmd/check-test-value -quiet
      - name: Check-dagnats-pin (doc pin vs go.mod)
        # Local-only check (grep, no network): the capability table in
        # docs/dagnats.md is verified against the go.mod pin.
        run: bash bin/check-dagnats-pin.sh
      - name: Check file size limits
        # The 500-line file budget was enforced ONLY by the pre-commit hook,
        # which `git commit --no-verify` (or LEFTHOOK_EXCLUDE) skips — so a
        # huge file could reach main with every other check green. Same script
        # the hook runs, so the two cannot disagree about the limit.
        # Function length is NOT checked here: `funlen` already does it via
        # golangci-lint, and it understands AST (it does not count lines inside
        # string literals or generated code). Duplicating that in bash would
        # create a second source of truth for the same rule.
        run: .githooks/check-sizes.sh
      - name: Check SKILL.md frontmatter
        # A skill's YAML frontmatter is parsed by the skill HOST, never by this
        # build — so a syntax error ships silently. Real YAML parser, not regex.
        run: go run ./cmd/check-skill-frontmatter
      - name: Check CI job self-provisioning
        # Each job runs on its own runner: using node/go without installing
        # them earlier in the SAME job fails (the missing-npm-ci that broke
        # the first parallel run). Local ci-local cannot catch this class —
        # a dev box always has everything warm.
        run: bash bin/check-ci-deps.sh
      - name: Datastar-lint
        # Version lives in go.mod's `tool` directive — one place, resolved by
        # the toolchain, the same contract as templ/deadcode/govulncheck. Bump
        # it deliberately, reading the release notes: a new release can raise a
        # rule to ERROR and fail the build with no code change here.
        run: make datastar-lint
      - name: Lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.14.0
          skip-cache: true
          # cmd/desktop pulls in wails v3, which needs webview CGO headers
          # unavailable on the ubuntu runner. No CI job builds it — it is a
          # local target (`make desktop`) — so lint the web-facing packages
          # (same set as scripts/web-packages.sh; router/ left with
          # the PB removal and must not come back here).
          args: ./cmd/web/ ./config/ ./features/... ./internal/... ./web/...
      - name: Install C toolchain (CGO for loro-go)
        # internal/collab uses loro-go, a CGO binding to the Loro C library.
        # The runner image carries third-party APT sources (packages.microsoft.com)
        # that can return 403 or lose their signature. apt-get update then exits
        # 100 even though the Ubuntu indexes updated, and this job failed on a
        # mirror it never asked for. Tolerate that exit code, then let the
        # install and the compiler check be the gate.
        run: |
          sudo apt-get update -qq || echo "⚠️ apt update reported a broken third-party source; installing from the image's indexes"
          sudo apt-get install -y gcc
          gcc --version | head -1
      - name: Gitleaks (no secrets in git history)
        # Pinned like datastar-lint: new detectors must not fail old trees.
        # Scans all commits (catches what a bypassed pre-commit hook let in).
        run: |
          go install github.com/zricethezav/gitleaks/v8@v8.30.1
          $(go env GOPATH)/bin/gitleaks detect --verbose --redact
      - name: Govulncheck (dependency vulnerabilities)
        # Authoritative security gate in CI, matching the local pre-push hook.
        # Scoped to the web/CI packages so cmd/desktop (Wails needs webview
        # CGO headers absent on this runner) isn't scanned — no CI job
        # compiles or scans it. Fail-fast: runs
        # before the expensive test suite.
        #
        # `go tool govulncheck`, not `go install ...@latest`: the scanner is
        # pinned by the `tool` directive in go.mod, so the gate runs the
        # version this repo declares instead of whatever the network served
        # that minute. An unpinned scanner is an unpinned attack surface
        # inside the very step that decides whether a push is safe, and a
        # scanner older than the toolchain can misread the module graph.
        run: |
          PKGS=$(bash scripts/web-packages.sh)
          go tool govulncheck $PKGS
      - name: Deadcode (advisory)
        # Matches bin/check-deadcode.sh: advisory only, scoped to the
        # packages that are meant to be wired-up, so intentionally-unused
        # library APIs (internal/llm, internal/datastar) stay off the radar.
        # `go tool` runs the version pinned by the tool directive in go.mod,
        # so the scan can never disagree with the toolchain about the module
        # the way `go install @latest` did (that mismatch reported type-check
        # errors as dead code).
        run: |
          go tool deadcode -test ./cmd/web/... ./features/... ./internal/nats/... ./internal/queue/... 2>&1 || echo "⚠️  dead code present (advisory)"
      - name: Set up Node (CSS build)
        uses: actions/setup-node@v7
        with:
          node-version: "20"
      - name: CSS build
        # css-check builds what it diffs. A check that diffs a file it did
        # not rebuild compares it to itself: empty by construction, green
        # however stale the committed bundle is.
        run: make css-check
      - name: Check CSS bundle is committed
        # `make css` writes app.min.css, which is COMMITTED and embedded in the
        # Go binary.
        # A stale committed bundle would pass if the build overwrote it before
        # anything compared. Source deps are pinned by package-lock.json +
        # `npm ci` (make css-install verifies the installed versions match the
        # lockfile), so this comparison is deterministic.
        run: |
          if ! git diff --quiet --exit-code -- web/resources/static/app.min.css; then
            echo "❌ committed CSS does not match src/css/*.  Run 'make css' and COMMIT."
            git diff --stat -- web/resources/static/
            exit 1
          fi
          echo "✓ CSS bundles match their sources"

  race:
    needs: [changes]
    # A docs-only changeset skips the suite, and so does one that touches no Go
    # package at all (scope_kind=none: CSS, markdown, deploy files). Running 80
    # packages for those is the waste this job now avoids, and `skipped` reports
    # through the aggregator as green by construction.
    if: needs.changes.outputs.docs_only != 'true' && needs.changes.outputs.scope_kind != 'none'
    # Three shards. The cost table isolates internal/installer (a third of the
    # suite, and it saturates the box alone), so the split is: shard 0 = the
    # outlier, shards 1-2 = the remaining ~79 packages bin-packed. Measured
    # before the split: one tail shard ran the full 203s range on its own, which
    # is what a count-based split would keep doing.
    #
    # The parallelism is across RUNNERS on purpose: Go already parallelizes
    # packages inside a shard, so a shard's cost is ~max(slowest package,
    # sum/cores) and adding packages to a shard mostly does not add wall-clock.
    strategy:
      # One red shard must not cancel the others: the surviving log is what tells
      # a real break from a broken split.
      fail-fast: false
      matrix:
        shard: [0, 1, 2]
    name: race shard ${{ matrix.shard }}
    runs-on: ubuntu-latest
    env:
      GOTOOLCHAIN: local
    steps:
      - uses: actions/checkout@v7
      - name: Install the pinned Go toolchain manually
        # actions/setup-go extracts the toolchain via tar and has been
        # intermittently corrupting it on this runner image. Install the
        # official stable tarball from go.dev into /usr/local/go instead,
        # which is a separate, reliable path. Version must match the
        # `go` directive in go.mod (bumped for GO-2026 stdlib CVEs).
        run: |
          bash bin/install-go-toolchain.sh
      - name: Restore Go build cache
        # Caching stays deliberately narrow, and it is a DIFFERENT mechanism from
        # the one this repo turned off. Commit d50d0fb disabled caching after
        # malformed restores ("/usr/bin/tar" exit 2) aborted jobs; that flake
        # lived in the INTERNAL caches of setup-go / setup-node /
        # golangci-lint-action, which stay off (`skip-cache: true` is untouched)
        # and docs/local-ci.md still records why. This is an explicit
        # actions/cache@v4 step, whose restore path is the JS client (zstd, not
        # /usr/bin/tar), and it is continue-on-error: a failed or evicted
        # restore costs a cold build, never a red job. What it buys is the cold
        # `-race` compile of 80 packages plus the installer suite's first
        # `go vet ./...` per trimmed tree.
        #
        # strategy.job-index is in the key on purpose: both race shards share the
        # job id, so without it they restore the same entry and the first to
        # finish overwrites the other's build cache with its own half — measured
        # as the installer shard swinging between 207s and 404s of test time on
        # identical code (runs 40875871811 and 40879126850). One key per leg, and
        # each leg's cache stays useful.
        uses: actions/cache@v4
        continue-on-error: true
        with:
          path: ~/.cache/go-build
          key: go-build-${{ runner.os }}-${{ github.job }}-${{ strategy.job-index }}-${{ hashFiles('go.mod', 'go.sum') }}
          restore-keys: |
            go-build-${{ runner.os }}-${{ github.job }}-
      - name: Restore Go module download cache
        # Only ~/go/pkg/mod/cache/download (the zips), not the extracted tree.
        # Measured: caching the whole module directory was break-even to a loss
        # (23-33s restore vs 16-29s download). This is roughly a third of that
        # size, and with the zips present `go mod download` extracts locally
        # instead of going to the proxy.
        uses: actions/cache@v4
        continue-on-error: true
        with:
          path: ~/go/pkg/mod/cache/download
          key: go-mod-dl-${{ runner.os }}-${{ hashFiles('go.mod', 'go.sum') }}
          restore-keys: |
            go-mod-dl-${{ runner.os }}-
      - name: Warm module cache
        # Cold runners download the full graph; the proxy answers storms
        # with transient INTERNAL_ERRORs, which go does not retry itself.
        #
        # Not cached, measured 2026-10-29 (runs 40865567690 cold and 40870630745
        # warm): restoring ~/go/pkg/mod costs 23-33s per job and saves 16-29s of
        # download, i.e. it is break-even to a net loss — and the winner is
        # nondeterministic because it is I/O against a proxy. The build cache is
        # the one that pays (it cut this job's test step 360s -> 207s).
        run: bash bin/go-mod-download.sh
      - name: Generate templ
        # Toolchain presence only — the checks job enforces that the
        # regenerated files are committed; tests build whatever is on
        # disk plus this regeneration.
        run: go tool templ generate
      - name: Install C toolchain (CGO for loro-go)
        # internal/collab uses loro-go, a CGO binding to the Loro C library.
        # The runner image carries third-party APT sources (packages.microsoft.com)
        # that can return 403 or lose their signature. apt-get update then exits
        # 100 even though the Ubuntu indexes updated, and this job failed on a
        # mirror it never asked for. Tolerate that exit code, then let the
        # install and the compiler check be the gate.
        run: |
          sudo apt-get update -qq || echo "⚠️ apt update reported a broken third-party source; installing from the image's indexes"
          sudo apt-get install -y gcc
          gcc --version | head -1
      - name: Test
        # Plain parallel run: the DagNats tests used to bind fixed ports, and
        # two packages grabbed the same one, which forced `-p 1`. They now bind
        # ephemeral ports and read the address back, so packages run in
        # parallel (~110s vs ~255s). cmd/desktop and cmd/gui are skipped: no CI
        # job builds either native target, so nothing here needs GTK/WebKit.
        #
        # Scope: the changes job resolved the packages this PR can affect (the
        # changed packages plus their transitive dependents) and this job shards
        # that list. Outside a PR, and whenever the changeset cannot be
        # classified, the universe is the full package list — the selection can
        # only ever narrow a run that would otherwise be bigger.
        run: |
          set -euo pipefail
          UNIVERSE="$RUNNER_TEMP/packages.txt"
          printf '%s\n' "${{ needs.changes.outputs.pkgs }}" | sed '/^[[:space:]]*$/d' > "$UNIVERSE"
          SHARD_UNIVERSE_FILE="$UNIVERSE" bash scripts/ci-shard-packages.sh ${{ matrix.shard }} 3 > "$RUNNER_TEMP/shard.txt"
          echo "shard ${{ matrix.shard }}: $(wc -l < "$RUNNER_TEMP/shard.txt") of $(wc -l < "$UNIVERSE") packages"
          TEST_PKGS_FILE="$RUNNER_TEMP/shard.txt" bash scripts/test-web.sh -race -count=1 -v

  browser:
    needs: [changes]
    if: needs.changes.outputs.docs_only != 'true'
    # Two groups, one runner each. The five suites are ~120s serial and the
    # setup around them ~80s, so the split buys the smaller half of that for the
    # price of a second runner. The parallelism is across RUNNERS on purpose:
    # the starvation ci-fanout.sh documents is suites sharing one runner's four
    # cores, which this does not do. Groups are by measured cost, not by count:
    # smoke 46s + whiteboard 14s + scroll 3s | notes 23s + SSE 34s. Costs are
    # re-measured whenever a suite changes shape — the first split put whiteboard
    # on the wrong side and cost 14s of wall.
    strategy:
      fail-fast: false
      matrix:
        client_group: [0, 1]
    name: browser group ${{ matrix.client_group }}
    runs-on: ubuntu-latest
    env:
      GOTOOLCHAIN: local
      # Client suites create their own users. A production-like environment
      # on the runner would close signup by default; this is a test fixture,
      # not a product default.
      SIGNUP_ENABLED: "true"
      # Turn on the WCAG-grade axe pass in the structural UI checks. The
      # dependency-free checks always run; this adds serious/critical axe rules.
      SMOKE_A11Y: "1"
    steps:
      - uses: actions/checkout@v7
      - name: Install the pinned Go toolchain manually
        # actions/setup-go extracts the toolchain via tar and has been
        # intermittently corrupting it on this runner image. Install the
        # official stable tarball from go.dev into /usr/local/go instead,
        # which is a separate, reliable path. Version must match the
        # `go` directive in go.mod (bumped for GO-2026 stdlib CVEs).
        run: |
          bash bin/install-go-toolchain.sh
      - name: Restore Go build cache
        # This job's cold `go build -o /tmp/gogo...` is 76s of CGO (loro-go) with
        # an empty cache; the same guardrail as the other Go jobs keeps a failed
        # restore from turning a gate red.
        uses: actions/cache@v4
        continue-on-error: true
        with:
          path: ~/.cache/go-build
          key: go-build-${{ runner.os }}-${{ github.job }}-${{ strategy.job-index }}-${{ hashFiles('go.mod', 'go.sum') }}
          restore-keys: |
            go-build-${{ runner.os }}-${{ github.job }}-
      - name: Restore Go module download cache
        # Only ~/go/pkg/mod/cache/download (the zips), not the extracted tree.
        # Measured: caching the whole module directory was break-even to a loss
        # (23-33s restore vs 16-29s download). This is roughly a third of that
        # size, and with the zips present `go mod download` extracts locally
        # instead of going to the proxy.
        uses: actions/cache@v4
        continue-on-error: true
        with:
          path: ~/go/pkg/mod/cache/download
          key: go-mod-dl-${{ runner.os }}-${{ hashFiles('go.mod', 'go.sum') }}
          restore-keys: |
            go-mod-dl-${{ runner.os }}-
      - name: Warm module cache
        # Cold runners download the full graph; the proxy answers storms
        # with transient INTERNAL_ERRORs, which go does not retry itself.
        run: bash bin/go-mod-download.sh
      - name: Install C toolchain (CGO for loro-go)
        # internal/collab uses loro-go, a CGO binding to the Loro C library.
        # The runner image carries third-party APT sources (packages.microsoft.com)
        # that can return 403 or lose their signature. apt-get update then exits
        # 100 even though the Ubuntu indexes updated, and this job failed on a
        # mirror it never asked for. Tolerate that exit code, then let the
        # install and the compiler check be the gate.
        run: |
          sudo apt-get update -qq || echo "⚠️ apt update reported a broken third-party source; installing from the image's indexes"
          sudo apt-get install -y gcc
          gcc --version | head -1
      - name: Set up Node (Playwright)
        uses: actions/setup-node@v7
        with:
          node-version: "20"
      - name: Install JS deps
        # The client suites import the playwright library: install from the
        # lockfile. (Previously this arrived incidentally — make css ran npm
        # ci earlier on the same runner. Separate jobs get separate runners.)
        run: npm ci --no-audit --no-fund
      - name: Restore Playwright browsers
        # Keyed on the lockfile, so a Playwright bump refetches Chromium instead
        # of running the new driver against a stale binary. `--with-deps` in the
        # smoke step still apt-installs the system libraries; only the browser
        # download is cached, and a failed restore falls through to a fetch.
        uses: actions/cache@v4
        continue-on-error: true
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      - name: Build
        # One binary for the client suites below (previously rebuilt per
        # suite). The boot smoke validates the endpoint contract from a fresh
        # compile; the suites below prove this artifact boots and serves.
        run: go build -o /tmp/gogogo-ci-web ./cmd/web/
      - name: Binary boot smoke test
        # Boots the REAL compiled binary and asserts the raw SSE transport
        # contract (GET /api/todos/stream -> 200 + text/event-stream) plus the
        # rendered #sse-opener wiring. This is the half the Playwright smoke
        # below does not cover: it validates the endpoint itself, not just that
        # a browser renders. Gated behind RUN_SMOKE=1 so `go test ./...` stays
        # port-free for developers.
        run: RUN_SMOKE=1 go test -count=1 -timeout 180s -run TestSmoke_BootedBinaryServesAndSyncs ./cmd/web/
      - name: Public readiness gate contract
        # The deploy proves the public URL serves the new build, so the gate
        # itself needs a contract: it must PASS on the right build, FAIL on a
        # different one, and FAIL (without hanging) on a broken path. A
        # readiness gate that cannot fail is worse than none.
        run: bash scripts/assert-public-ready.test.sh
      - name: Install Chromium
        # Both groups need the browser, so the install is its own step rather
        # than riding inside the smoke suite (it could ride there while the
        # suites shared one runner). The download is cached; --with-deps still
        # apt-installs the system libraries.
        run: npx playwright install --with-deps chromium
      - name: Browser smoke test
        if: matrix.client_group == 0
        # Datastar is a global client runtime; exercise the rendered app in
        # Chromium so upgrades cannot pass Go checks while breaking signals.
        run: SMOKE_BIN=/tmp/gogogo-ci-web bash scripts/run-browser-suite.sh smoke.mjs
      - name: Whiteboard client regression tests
        if: matrix.client_group == 0
        # The whiteboard client has no Go-side coverage for its transport
        # handling: response ordering and the 409 conflict path only exist in
        # whiteboard.js. A real regression lived here (adopting the server's
        # shape list from a POST response dropped a shape the user had just
        # drawn, because concurrent responses are not ordered). These tests
        # drive the page and assert on canvas pixels; both are red-proofed.
        run: |
          SMOKE_BIN=/tmp/gogogo-ci-web bash scripts/run-browser-suite.sh whiteboard-client.test.mjs
      - name: Notes caret client regression tests
        if: matrix.client_group == 1
        # Cross-user caret positioning: the mirror-div must be measured against
        # the reporter's text snapshot, not the observer's (possibly stale)
        # ta.value. The reported bug — a peer's end-of-line caret appearing at
        # the start of the line below while an op was in flight — is reproduced
        # here by two real authenticated contexts typing concurrently. The
        # line assertion is red-proofed (fails against the old basis).
        run: |
          SMOKE_BIN=/tmp/gogogo-ci-web bash scripts/run-browser-suite.sh notes-caret.test.mjs
      - name: SSE verified-open regression test
        if: matrix.client_group == 1
        # The opener must fail LOUDLY when Datastar cannot load (bounded
        # openState=failed), never leave a silent-dead stream: with Datastar
        # route-aborted, the old opener never opens anything (red-proofed by
        # stash). Uses its own port, serial like the suites above.
        run: |
          SMOKE_BIN=/tmp/gogogo-ci-web bash scripts/run-browser-suite.sh sse-reopen.test.mjs SSE_PROBE_PORT=8133
      - name: AI answer scroll regression test
        if: matrix.client_group == 0
        # A new answer must scroll itself into view on a short window — the
        # region was appended below the fold and the reply arrived
        # off-screen (red-proofed by removing the anchors: scrollY 0 → 0).
        # Drives BOTH legs (chat append, Ask outer-replace) with the keyless
        # simulated LLM, so no provider key is involved. Own port, serial
        # like the suites above.
        run: |
          SMOKE_BIN=/tmp/gogogo-ci-web bash scripts/run-browser-suite.sh chat-scroll.test.mjs

  prod-image:
    needs: [changes]
    if: needs.changes.outputs.docs_only != 'true'
    # Committed sources + Dockerfile only (no Go/Node): a broken image
    # fails fast in parallel instead of after the whole suite.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Production image boot smoke test
        # Builds deploy/Dockerfile.prod, boots the FINAL image (uid 65532,
        # data volume, TURSO_GO_CACHE_DIR) and asserts /health → 200. This
        # is the gate the 0.44.0 outage was missing: `go build` was green
        # while the scratch image could never dlopen the tursogo library,
        # so production crash-looped with 502s. Fails on the pre-fix
        # Dockerfile (container exits during boot, logs shown). Runs on
        # linux/amd64 here; the musl library exists per-arch, so the boot
        # mechanism proven here covers the arm64 server build too.
        run: bash scripts/smoke-prod-image.sh gogogo:prod-smoke-ci

  site:
    # Docs-site layout, in a real browser. docs/*.md is rendered by
    # site/build.mjs into the pages GitHub Pages publishes, and a markdown
    # table whose cells hold real paragraphs used to take its intrinsic width
    # — 15.5x the content column on docs/features.md — so the last column was
    # never on screen (issue #189). CSS-only checks cannot see that: the bug
    # is a measurement. It runs on EVERY changeset, including docs-only ones,
    # because those skip every other job by design and they are exactly the
    # changes that can break the site.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Set up Node (Playwright)
        uses: actions/setup-node@v7
        with:
          node-version: "20"
      - name: Install JS deps
        run: npm ci --no-audit --no-fund
      - name: Restore Playwright browsers
        # Same key as the browser job: this job loads every published page at 7
        # widths, and a cold Chromium fetch is most of its 60-70s.
        uses: actions/cache@v4
        continue-on-error: true
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Check landing catalog
        run: node site/build-landing.mjs --check
      - name: Docs site layout
        # Builds the same site pages.yml publishes, then loads every page at
        # 7 widths. Fails on page-level scroll, a table that cannot fit at
        # desktop widths, a prose line box pushed out of its reading measure,
        # or a table scroll box with no label / keyboard access / edge fade.
        run: node scripts/site-layout.test.mjs

  release-guard:
    # A release PR is the one PR nobody should merge by reflex: it decides the
    # version. release-please-config.json's `bump-minor-pre-major` keeps a
    # breaking change inside 0.MINOR (pinned by internal/release_policy_test.go),
    # but a title naming a major, or a manifest somebody bumped by hand, would
    # still open a clean-looking 1.0.0 PR. This gate makes that a red build with
    # a name instead of a plausible PR with a green tick.
    if: github.event_name == 'pull_request' && startsWith(github.head_ref, 'release-please--branches--')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Proposed version stays inside 0.x
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          python3 - <<'EOF'
          import json, os, re, sys

          title = os.environ["PR_TITLE"]
          m = re.search(r"release (\d+)\.(\d+)\.(\d+)", title)
          if not m:
              print(f"::error::release PR title carries no version: {title!r}")
              sys.exit(1)
          major, minor, patch = (int(g) for g in m.groups())
          manifest = json.load(open(".github/.release-please-manifest.json"))["."]
          print(f"title proposes {major}.{minor}.{patch}; manifest says {manifest}")
          if major >= 1:
              print("::error::pre-1.0 repo: a 1.x release needs an explicit human request (AGENTS.md, Releases)")
              sys.exit(1)
          if not manifest.startswith("0."):
              print(f"::error::manifest is {manifest}: 1.x is a product decision, not a merge")
              sys.exit(1)
          EOF

  ci:
    # Aggregator for branch protection: master requires a single `ci`
    # status context, and parallel jobs cannot provide a stable name —
    # this job succeeds only when every gate above succeeded. A cancelled
    # (superseded) run reports through here as failure-free, never red.
    # Skipped gates (docs-only changesets) are green by construction:
    # only `failure` fails this job, so the required status always
    # reports even when the heavy jobs never ran.
    needs: [changes, checks, race, browser, prod-image, site, release-guard]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: All gates green
        run: |
          python3 - <<'EOF'
          import json, os, sys
          needs = json.loads(os.environ["NEEDS_JSON"])
          bad = {k: v["result"] for k, v in needs.items() if v["result"] == "failure"}
          if bad:
              print("failing gates:", bad)
              sys.exit(1)
          print("all gates green:", sorted(needs))
          EOF
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
