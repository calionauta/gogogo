# docker-compose.prod.yml — production deployment for gogogo.
# Used by:
#   - GitHub Actions deploy workflow (via ssh-action on the server)
#   - The on-server script scripts/deploy-prod.sh
#
# Environment variables that are NOT secrets come from .env (committed).
# Secrets come from secrets/${APP_NAME}.env (mode 600, regenerated
# every deploy from GitHub Actions secrets — never committed).

name: gogogo

services:
  gogogo:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.prod
    image: gogogo:prod
    container_name: gogogo
    restart: unless-stopped
    user: "65532:65532"
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      # Non-secret env (from .env) — defaults baked in but can be overridden
      # in the .env file.
      APP_NAME: ${APP_NAME:-gogogo}
      APP_URL: ${APP_URL:-https://fullstack.example.com}
      HOST: 0.0.0.0
      PORT: "8080"
      ENVIRONMENT: ${ENVIRONMENT:-production}
      DATA_DIR: /var/lib/gogogo/data
      # tursogo extracts its native library to TURSO_GO_CACHE_DIR at first
      # DB open (default $HOME/.cache, i.e. /tmp for uid 65532). Point it at
      # the data volume instead: /tmp may be tiny or shared, and persisting
      # the extracted + hash-verified .so avoids re-extracting every boot.
      # The directory is created by the app before first use. (Without this,
      # scratch-era images died even earlier with `mkdir /tmp/turso-go:
      # permission denied` — production 0.44.0.)
      TURSO_GO_CACHE_DIR: /var/lib/gogogo/data/.turso-cache
      # LLM (these three lines are wired by the GH Action deploy;
      # GOAI_API_KEY + GOAI_BASE_URL + GOAI_MODEL come from the
      # secrets env_file below, never committed). GOAI_BASE_URL /
      # GOAI_MODEL default to OpenRouter with a verified-free default
      # model (Oct 2026: nvidia/nemotron-3-super-120b-a12b:free, $0 in +
      # out, text->text, structured outputs for Ask AI). The free catalog
      # rotates — re-check https://openrouter.ai/models?order=free when
      # Ask starts 404ing, and override via env to pin another :free id.
      GOAI_BASE_URL: ${GOAI_BASE_URL:-https://openrouter.ai/api/v1}
      GOAI_MODEL: ${GOAI_MODEL:-nvidia/nemotron-3-super-120b-a12b:free}
      # Realtime — binary built with -tags jetstream.
      NATS_ENABLED: "true"
      NATS_STORE_DIR: /var/lib/${APP_NAME:-gogogo}/data/nats
      # Durable workflow — build with -tags dagnats. DagNats boots its
      # own embedded NATS and its HTTP API/console on DAGNATS_HTTP_ADDR
      # (default 127.0.0.1:8090). Under -tags "jetstream dagnats" it owns
      # the same NATS the realtime broadcaster uses (single-NATS).
      DAGNATS_ENABLED: "true"
      DAGNATS_HTTP_ADDR: "127.0.0.1:8090"
      DAGNATS_STORE_DIR: /var/lib/${APP_NAME:-gogogo}/data/dagnats
      WORKFLOW_EXECUTOR_ID: local
      # Demo affordance: the keyless "Suggest (simulated)" button
      # uses an in-process fake LLM that scripts 500 -> 200 + delay
      # so visitors can watch the full queue + retry + SSE pipeline
      # without burning real tokens. Kept ON by default for the
      # public demo site; the real LLM button (GOAI_API_KEY-gated)
      # is rendered independently when that key is set.
      SIMULATE_LLM: ${SIMULATE_LLM:-true}
    env_file:
      - /home/deploy/.secrets/gogogo.env
    volumes:
      # Bind mount (not Docker volume) so operators can inspect/back up
      # the SQLite WAL files without docker exec (see scripts/db-tools/).
      #
      # Host source is /home/deploy/services/<APP_NAME>/data (NOT /var/lib): the
      # deploy user is non-root and cannot mkdir/chown under /var/lib, so
      # the deploy script creates + ACLs the dir under /home/deploy and
      # grants container uid 65532 write access. The container target
      # stays /var/lib/<APP_NAME>/data — that is what the app's DATA_DIR
      # env points at, so the in-container path is unchanged.
      - /home/deploy/services/${APP_NAME:-gogogo}/data:/var/lib/${APP_NAME:-gogogo}/data
    healthcheck:
      # Exec form (no shell needed) — `/app health` is a built-in
      # subcommand that GETs /health internally. (Survives base-image
      # changes: it worked on scratch and works on alpine alike.)
      test: ["CMD", "/app", "health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
